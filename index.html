    // ── 캔버스 스케일 ──
    (function () {
        var BASE_W = 1280, BASE_H = 800;
        function updateScale() {
            var canvas = document.getElementById('scale-canvas');
            if (!canvas) return;
            var scale = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
            canvas.style.transform = 'scale(' + scale + ')';
        }
        window.addEventListener('resize', updateScale);
        updateScale();
        setTimeout(updateScale, 100);
    })();

function lsGet(key, fallback) {
    try { var v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
}
function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

// ── GAS 통신 ──
function gasGet(type, params) {
    var url = GAS_URL + '?type=' + type;
    if (params) {
        Object.keys(params).forEach(function(k) {
            url += '&' + k + '=' + encodeURIComponent(params[k]);
        });
    }
    return fetch(url).then(function(r) { return r.json(); });
}
function gasPost(data) {
    return fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
    });
}

function MainMenu(props) {

        did1_2: progress.did1_2 || false,
        did2_2: progress.did2_2 || false,

    };

    // 잠금 계산
    var stage1Sub1Done = state.cards1 > 0;
    var stage1Sub2Done = state.did1_2;
    var stage1Sub2Locked = state.cards1 < 4;
    var stage1Sub2LockReason = "1단계 카드 " + state.cards1 + "/4장 모으기";

    var stage2Sub1Done = state.cards2 > 0;

    var stage2Sub2Locked = state.cards2 < 4;
    var stage2Sub2LockReason = "마음 카드 " + state.cards2 + "/4장 모으기";

    var stage3Locked = !(state.did1_2 && state.did2_2);
    var stage3LockReason = "1단계와 2단계 '카드로 문장'을 먼저 해주세요!";

    var progresses = [
        { sub1Done: stage1Sub1Done, sub2Done: stage1Sub2Done, sub2Locked: stage1Sub2Locked, sub2LockReason: stage1Sub2LockReason, stageLocked: false, stageLockReason: '' },
        { sub1Done: stage2Sub1Done, sub2Done: stage2Sub2Done, sub2Locked: stage2Sub2Locked, sub2LockReason: stage2Sub2LockReason, stageLocked: false, stageLockReason: '' },
        { sub1Done: false,          sub2Done: false,          sub2Locked: false,            sub2LockReason: '',                   stageLocked: stage3Locked, stageLockReason: stage3LockReason }
    ];

    var totalDone = 0;
    if (stage1Sub1Done) totalDone++;
    if (stage1Sub2Done) totalDone++;
    if (stage2Sub1Done) totalDone++;
    if (stage2Sub2Done) totalDone++;
    if (!stage3Locked) totalDone++;
    var progressPct = (totalDone / 5) * 100;

    function navigateToStage(stageNum) {
        // 토스트 잠깐 표시 후 실제 이동
        setNavTarget({ stage: stageNum, time: Date.now() });
        setTimeout(function () {
            setNavTarget(null);
            // 1단계/2단계는 하위 메뉴로 이동 (1→1_1, 2→2_1, 3→3)
            var map = {1: '1_1', 2: '2_1', 3: '3'};
            if (map[stageNum]) onNavigate(String(stageNum), map[stageNum] === '3' ? null : '1');
        }, 600);
    }

    return h("div", { className: "h-full w-full flex flex-col relative" },
        h("div", { className: "px-10 pt-6 pb-3 flex items-center justify-between shrink-0" },
            h("div", { className: "flex items-center gap-4" },

                }, "다른 학생")
            )
        ),

        h("div", { className: "px-10 pb-3 shrink-0" },
            h("div", { className: "bg-white rounded-3xl px-5 py-3 shadow-lg border-4 border-yellow-200 flex items-center gap-4" },

function ColoredSentence(props) {
    var parts = props.parts;
    var size = props.size || 'lg'; // 'sm' or 'lg'
    var keys = ['when', 'where', 'who', 'what'];
    var textSize = size === 'sm' ? 'text-xl' : 'text-3xl';
    var pad = size === 'sm' ? 'px-3 py-2' : 'px-5 py-3';
    return h("div", { className: "flex flex-wrap items-end gap-2 justify-center" },
        parts.map(function (p, i) {
            var c = FIELD_COLORS[keys[i]];
            return h("div", { key: i, className: "flex flex-col items-center gap-1" },
                size === 'lg' && h("span", { className: "text-xs font-black " + c.text }, c.name),
                h("span", {
                    className: pad + " rounded-2xl font-black shadow-md border-4 " + textSize + " " + c.bg + " " + c.text + " " + c.border
                }, p)
            );
        })
    );
}

// 한 문장을 4영역으로 받아서, 글자별로 색을 매칭해 10칸 공책에 그리기
function buildCellGrid(parts) {
    // parts = [언제, 어디서, 누구와, 무엇을]
    // 결과: [{ ch: '오', color: 'when' }, ...]
    var keys = ['when', 'where', 'who', 'what'];
    var cells = [];
    for (var i = 0; i < parts.length; i++) {
        var word = parts[i];
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') {
                cells.push({ ch: '', color: null, isSpace: true });
            } else {
                cells.push({ ch: ch, color: keys[i] });
            }
        }
        // 어절 사이 공백 (마지막 어절 뒤에는 없음)
        if (i < parts.length - 1) {
            cells.push({ ch: '', color: null, isSpace: true });
        }
    }
    return cells;
}

// 공책 칸 그리기 (cells = 글자 배열, 칸당 10개씩 줄바꿈)
// 줄 수에 따라 칸 크기를 자동 조절: 1~2줄=큼, 3줄=중간, 4줄+=작음
function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;
    var rows = [];
    for (var i = 0; i < cells.length; i += perRow) {
        rows.push(cells.slice(i, i + perRow));
    }
    // 마지막 줄이 10칸 미만이면 빈 칸으로 채워서 시각적 정렬
    while (rows[rows.length - 1].length < perRow) {
        rows[rows.length - 1].push({ ch: '', color: null, isEmpty: true });
    }

    // 줄 수에 따라 셀 크기 결정 (가독성과 화면 맞춤의 균형)
    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) {
        cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3';
    } else if (lineCount === 3) {
        cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2';
    } else {
        // 4줄 이상
        cellSize = 'w-14 h-14'; textSize = 'text-2xl'; gap = 'gap-2';
    }

    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {
                    var bgClass = 'bg-white';
                    var textClass = 'text-slate-700';
                    var borderClass = 'border-slate-300';
                    if (cell.color) {
                        var c = FIELD_COLORS[cell.color];
                        bgClass = c.bg;
                        textClass = c.text;
                        borderClass = c.border;
                    }
                    if (cell.isSpace) {
                        // 빈 칸(띄어쓰기): 옅은 회색
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-200 border-dashed';
                    }
                    if (cell.isEmpty) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-100';
                    }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass
                    }, cell.ch);
                })
            );
        })
    );
}

// ───── 음성 비교 헬퍼 ─────
// 비교용 정규화: 공백 제거, 조사 일부 제거 (1-2학년 발음 차이 흡수)
function normalize(s) {
    if (!s) return '';
    var t = String(s).toLowerCase();
    // 모든 공백/특수문자 제거
    t = t.replace(/[\s.,!?~'"`\-_]+/g, '');
    return t;
}

// 한 요소(예: '학교에서')가 음성에 포함되는지 검사
// 어절 핵심부 추출 후 매칭 (조사 변동 흡수)
function fieldMatched(transcript, target) {
    var nT = normalize(transcript);
    var nTarget = normalize(target);
    if (!nT || !nTarget) return false;

    // 1) 직접 포함되면 OK
    if (nT.indexOf(nTarget) !== -1) return true;

    // 2) 어간 추출 비교: 대상에서 흔한 어미/조사 제거 후 비교
    //    "학교에서" → "학교", "친구랑" → "친구", "반갑게 인사했다" → "반갑게인사"
    var trimmed = nTarget
        .replace(/(에서|에게|이랑|랑|이|가|을|를|은|는|와|과|께|에)$/g, '')
        .replace(/(했다|했어요|했어|했지|한다)$/g, '하')
        .replace(/(었다|었어요|었어|었지)$/g, '');
    if (trimmed.length >= 2 && nT.indexOf(trimmed) !== -1) return true;

    // 3) 글자 단위 부분 일치: 대상의 70% 이상 문자가 순서대로 나타나면 OK
    //    (음성 인식 오류 흡수용)
    if (nTarget.length >= 2) {
        var matched = 0, idx = 0;
        for (var i = 0; i < nTarget.length; i++) {
            var pos = nT.indexOf(nTarget.charAt(i), idx);
            if (pos !== -1) { matched++; idx = pos + 1; }
        }
        if (matched / nTarget.length >= 0.7) return true;
    }
    return false;
}

// 예시문장 4요소가 각각 음성에 들어갔는지 검사
function checkAllFields(transcript, exampleParts) {
    // exampleParts = [언제, 어디서, 누구와, 무엇을]
    var keys = ['when', 'where', 'who', 'what'];
    var result = {};
    for (var i = 0; i < 4; i++) {
        result[keys[i]] = fieldMatched(transcript, exampleParts[i]);
    }
    return result;
}

// 한 문장을 4영역으로 받아서, 글자별로 색을 매칭해 10칸 공책에 그리기
function buildCellGrid(parts) {
    var keys = FIELD_KEYS;
    var cells = [];
    for (var i = 0; i < parts.length; i++) {
        var word = parts[keys[i]];
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') {
                cells.push({ ch: '', color: null, isSpace: true });
            } else {
                cells.push({ ch: ch, color: keys[i] });
            }
        }
        if (i < parts.length - 1) {
            cells.push({ ch: '', color: null, isSpace: true });
        }
    }
    return cells;
}

// 공책 칸 그리기 (cells = 글자 배열, 칸당 10개씩 줄바꿈)
function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;
    var rows = [];
    for (var i = 0; i < cells.length; i += perRow) {
        rows.push(cells.slice(i, i + perRow));
    }
    while (rows[rows.length - 1].length < perRow) {
        rows[rows.length - 1].push({ ch: '', color: null, isEmpty: true });
    }

    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) {
        cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3';
    } else if (lineCount === 3) {
        cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2';
    } else {
        cellSize = 'w-14 h-14'; textSize = 'text-2xl'; gap = 'gap-2';
    }

    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {
                    var bgClass = 'bg-white';
                    var textClass = 'text-slate-700';
                    var borderClass = 'border-slate-300';
                    if (cell.color) {
                        var c = FIELD_COLORS[cell.color];
                        bgClass = c.bg;
                        textClass = c.text;
                        borderClass = c.border;
                    }
                    if (cell.isSpace) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-200 border-dashed';
                    }
                    if (cell.isEmpty) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-100';
                    }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass
                    }, cell.ch);
                })
            );
        })
    );
}

        init[card.key] = card.value;

        setMyParts(init);
        // 첫 빈 칸 활성화

        for (var i = 0; i < FIELD_KEYS.length; i++) {

    function fillActive(value) {
        if (!value || !activeField) return;

            for (var i = 0; i < FIELD_KEYS.length; i++) {

                        { mode: 'cards', label: '📇 카드에서 고르기' }
                    ].map(function (opt) {

                                key: ci,
                                whileHover: { scale: 1.05, y: -3 },
                                whileTap: { scale: 0.95 },

            h("div", { className: "flex gap-3" },
                h("button", {
                    onClick: function () {
                        // 다시 만들기 — 카테고리 칸만 유지
                        var reset = { when:'', where:'', who:'', what:'' };
                        reset[chosenCard.key] = chosenCard.value;
                        setMyParts(reset);
                        var firstEmpty = null;
                        for (var i = 0; i < FIELD_KEYS.length; i++) {
                            if (!reset[FIELD_KEYS[i]]) { firstEmpty = FIELD_KEYS[i]; break; }
                        }
                        setActiveField(firstEmpty);
                        setInputMode('mic');
                        setTyping('');
                        setSubStep('compose');
                    },
                    className: "px-7 py-3 bg-slate-100 text-slate-600 rounded-2xl text-lg font-black border-2 border-slate-200 hover:bg-slate-200"
                }, "🔄 다시 만들기"),
                h("button", {
                    onClick: function () { setSubStep('pickCard'); },

                h("button", {
                    onClick: function () { setSubStep('write'); },

        );
    }

    // ───── write (10칸 공책에 손글씨로 쓰기) ─────
    else if (subStep === 'write') {
        var partsArr = [myParts.when, myParts.where, myParts.who, myParts.what];
        var cells = buildCellGrid(myParts);
        var lineCount = Math.ceil(cells.length / 10);

        content = h("div", { className: "flex flex-col h-full p-5 gap-3" },
            h("div", { className: "flex items-start gap-4 shrink-0" },
                h(PencilFairy, { mini: true }),

                    h("p", { className: "text-base text-slate-500 font-bold mt-1" },
                        "화면을 보면서 ",
                        h("span", { className: "text-orange-600 font-black" }, "내 공책에 직접"),
                        " 한 글자씩 써보세요"
                    )
                ),
                h("button", {
                    onClick: function () { setSubStep('review'); },
                    className: "ml-auto self-center px-4 py-2 bg-slate-100 text-slate-500 rounded-2xl font-black text-base hover:bg-slate-200"
                }, "← 미리보기")
            ),
            h("div", { className: "flex-1 flex items-center justify-center" },
                h("div", { className: "bg-white p-6 rounded-[2rem] shadow-2xl border-4 border-orange-200" },
                    h(NotebookGrid, { cells: cells })
                )
            ),
            h("div", { className: "flex items-center justify-center gap-4" },
                h("div", { className: "px-5 py-2 bg-amber-50 border-2 border-amber-200 rounded-full text-amber-700 font-black" },
                    lineCount === 1 ? "📖 한 줄짜리 짧은 문장이에요" :
                    lineCount === 2 ? "📖 두 줄짜리 문장이에요" :
                    lineCount === 3 ? "📖 세 줄짜리 문장이에요" :
                    "📖 " + lineCount + "줄짜리 긴 문장이에요"
                ),
                h("button", {
                    onClick: function () { setSubStep('complete'); },
                    className: "px-10 py-3 bg-emerald-500 text-white rounded-2xl text-xl font-black shadow-[0_6px_0_rgb(4,120,87)] active:translate-y-1 active:shadow-none"
                }, "✅ 공책에 다 썼어요!")
            )
        );
    }

    // ───── complete ─────
    else if (subStep === 'complete') {
        content = h("div", { className: "flex flex-col items-center justify-center h-full p-8 gap-6" },
            h(motion.div, { initial: { scale: 0 }, animate: { scale: 1 }, className: "text-8xl" }, "🎊"),
            h("h2", { className: "text-5xl font-black text-orange-600" }, "1단계 ❷ 끝! 정말 멋져요!"),
            h("p", { className: "text-2xl font-bold text-slate-600" },
                "스스로 만든 문장이에요!"
            ),
            h("div", { className: "bg-white p-5 rounded-[2rem] shadow-xl border-4 border-orange-200" },
                h("div", { className: "flex flex-wrap items-end gap-2 justify-center" },
                    FIELD_KEYS.map(function (k, i) {
                        var c = FIELD_COLORS[k];
                        return h("div", { key: i, className: "flex flex-col items-center gap-1" },
                            h("span", { className: "text-xs font-black " + c.text }, c.name),
                            h("span", {
                                className: "px-3 py-2 rounded-2xl text-xl font-black shadow-md border-4 " + c.bg + " " + c.text + " " + c.border
                            }, myParts[k])
                        );
                    })
                )
            ),
            h("button", {
                onClick: function() {
                    if (props.onComplete) props.onComplete(myParts);
                    else restart();
                },
                className: "px-16 py-5 bg-orange-500 text-white rounded-2xl text-3xl font-black shadow-[0_8px_0_rgb(154,52,18)] active:translate-y-1 active:shadow-none"
            }, "← 메뉴로 돌아가기")
        );
    }

    return h("div", { className: "h-full w-full bg-[#F0F7FF] flex flex-col" },
        h("div", { className: "px-8 pt-5 pb-2 flex items-center justify-between" },
            h("span", { className: "px-4 py-2 bg-red-100 text-red-700 rounded-2xl font-black text-base border border-red-200" },
                "1단계 ❷ 카드로 문장 만들기 (4요소)"
            ),
            h("div", { className: "flex items-center gap-2 px-5 py-2 bg-white border-2 border-orange-300 rounded-2xl shadow-sm" },
                h("span", { className: "text-2xl" }, "🃏"),
                h("span", { className: "text-xl font-black text-orange-600" }, "모은 카드: " + collected.length + "장")
            )
        ),
        h("main", { className: "flex-1 overflow-hidden relative" }, content)
    );
}

// ────── 음성 비교 헬퍼 (1단계와 동일) ──────
function normalize(s) {
    if (!s) return '';
    var t = String(s).toLowerCase();
    t = t.replace(/[\s.,!?~'"`\-_]+/g, '');
    return t;
}
function fieldMatched(transcript, target) {
    var nT = normalize(transcript);
    var nTarget = normalize(target);
    if (!nT || !nTarget) return false;
    if (nT.indexOf(nTarget) !== -1) return true;
    var trimmed = nTarget
        .replace(/(에서|에게|이랑|랑|이|가|을|를|은|는|와|과|께|에)$/g, '')
        .replace(/(했다|했어요|했어|했지|한다)$/g, '하')
        .replace(/(었다|었어요|었어|었지)$/g, '');
    if (trimmed.length >= 2 && nT.indexOf(trimmed) !== -1) return true;
    if (nTarget.length >= 2) {
        var matched = 0, idx = 0;
        for (var i = 0; i < nTarget.length; i++) {
            var pos = nT.indexOf(nTarget.charAt(i), idx);
            if (pos !== -1) { matched++; idx = pos + 1; }
        }
        if (matched / nTarget.length >= 0.7) return true;
    }
    return false;
}
function checkAllFields(transcript, parts) {
    var keys = FIELD_KEYS;
    var result = {};
    for (var i = 0; i < keys.length; i++) {
        result[keys[i]] = fieldMatched(transcript, parts[i]);
    }
    return result;
}

// 공책 칸 셀
function buildCellGrid(parts) {
    var keys = FIELD_KEYS;
    var cells = [];
    for (var i = 0; i < parts.length; i++) {
        var word = parts[i];
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') cells.push({ ch: '', color: null, isSpace: true });
            else cells.push({ ch: ch, color: keys[i] });
        }
        if (i < parts.length - 1) cells.push({ ch: '', color: null, isSpace: true });
    }
    return cells;
}

function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;
    var rows = [];
    for (var i = 0; i < cells.length; i += perRow) rows.push(cells.slice(i, i + perRow));
    while (rows[rows.length - 1].length < perRow) rows[rows.length - 1].push({ ch:'', color:null, isEmpty:true });
    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) { cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3'; }
    else if (lineCount === 3) { cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2'; }
    else { cellSize = 'w-14 h-14'; textSize = 'text-2xl'; gap = 'gap-2'; }
    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {
                    var bgClass = 'bg-white', textClass = 'text-slate-700', borderClass = 'border-slate-300';
                    if (cell.color) { var c = FIELD_COLORS[cell.color]; bgClass = c.bg; textClass = c.text; borderClass = c.border; }
                    if (cell.isSpace) { bgClass = 'bg-slate-50'; borderClass = 'border-slate-200 border-dashed'; }
                    if (cell.isEmpty) { bgClass = 'bg-slate-50'; borderClass = 'border-slate-100'; }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass
                    }, cell.ch);
                })
            );
        })
    );
}

// 감정들을 자연스럽게 연결 ("기쁘다, 신나다" → "기쁘고 신났다" 또는 "기쁘면서 신났다")
function joinFeelings(feelings) {
    if (!feelings || feelings.length === 0) return '';
    if (feelings.length === 1) return feelings[0].text;
    // "다"로 끝나는 단어를 자연스럽게 연결
    var parts = feelings.map(function (f, i) {
        if (i === feelings.length - 1) return f.text;
        // 중간 감정들은 "~고" 형태로
        var t = f.text;
        // "다"로 끝나면 "고"로 바꾸기
        if (/다$/.test(t)) {
            return t.replace(/다$/, '고');
        }
        return t;
    });
    return parts.join(' ');
}

// 일기 본문 자동 생성: 1단계-2 + 2단계-2 결과 합치기
function composeDiaryText(d) {
    var parts = d.baseParts;
    // 1단계-2 결과
    var s1 = parts.when + ' ' + parts.where + ' ' + parts.who + ' ' + parts.what + '.';
    // 2단계-2 결과 (감정 + 이유)
    var feelingText = joinFeelings(d.feelings);
    var s2 = '그래서 ' + feelingText + '.';
    var reasonClean = (d.reason || '').trim();
    if (!/[.!?。]$/.test(reasonClean)) reasonClean += '.';
    var s3 = '왜냐하면 ' + reasonClean;
    return s1 + ' ' + s2 + ' ' + s3;
}

function DrawBoard(props) {
    var canvasRef = useRef(null);
    var s = useState(false); var drawing = s[0], setDrawing = s[1];
    var s2 = useState('#1e40af'); var color = s2[0], setColor = s2[1];
    var s3 = useState(4); var thickness = s3[0], setThickness = s3[1];

    var COLORS = ['#1e40af', '#dc2626', '#16a34a', '#ca8a04', '#a855f7', '#000000'];

    function getPos(e, canvas) {
        var rect = canvas.getBoundingClientRect();
        var sx = canvas.width / rect.width;
        var sy = canvas.height / rect.height;
        var clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        var clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
        return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
    }

    function start(e) {
        e.preventDefault();
        var canvas = canvasRef.current;
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var p = getPos(e, canvas);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = thickness;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        setDrawing(true);
    }
    function move(e) {
        if (!drawing) return;
        e.preventDefault();
        var canvas = canvasRef.current;
        var ctx = canvas.getContext('2d');
        var p = getPos(e, canvas);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    }
    function end() { setDrawing(false); }
    function clear() {
        var canvas = canvasRef.current;
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 흰 배경 다시 깔기
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 첫 렌더 시 흰 배경
    useEffect(function () {
        var canvas = canvasRef.current;
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }, []);

    // 외부에서 그림 데이터 가져갈 수 있게
    useEffect(function () {
        if (props.canvasRefOut) props.canvasRefOut(canvasRef.current);
    });

    return h("div", { className: "flex flex-col gap-2" },
        // 도구
        h("div", { className: "flex items-center gap-2 flex-wrap" },
            // 색
            h("div", { className: "flex gap-1" },

                    return h("button", {
                        key: c,
                        onClick: function () { setColor(c); },
                        style: { backgroundColor: c },
                        className: "w-8 h-8 rounded-full border-2 " + (color === c ? "border-slate-800 ring-2 ring-slate-300" : "border-white shadow")
                    });
                })
            ),
            // 굵기
            h("div", { className: "flex gap-1 ml-2" },
                [2, 4, 8].map(function (t) {
                    return h("button", {

                        onClick: function () { setThickness(t); },

                    },
                        h("div", {

                        })

                        h("h1", { className: "text-5xl font-black text-slate-800 mb-3" }, "오늘의 일기를"),
                        h("h1", { className: "text-5xl font-black text-emerald-600 mb-4" }, "완성하고 제출해요!"),

                        onClick: function () { setSubStep('compose'); },
                        className: "px-16 py-5 bg-emerald-500 text-white rounded-[2.5rem] text-3xl font-black shadow-[0_8px_0_rgb(4,120,87)] active:translate-y-1 active:shadow-none mt-2"
                    }, "일기 쓰러 가기! ✍️")

    // ───── compose ─────

        content = h("div", { className: "flex flex-col h-full p-4 gap-3" },
            h("div", { className: "flex items-start gap-3 shrink-0" },
                h(PencilFairy, { mini: true }),
                h("div", { className: "bg-white px-6 py-3 rounded-3xl shadow-xl border-2 border-emerald-200 mt-4" },
                    h("h2", { className: "text-xl font-black text-slate-800" }, "제목 · 일기 본문 · 그림을 완성해봐요!"),
                    h("p", { className: "text-sm text-slate-500 font-bold mt-1" }, "본문은 1단계와 2단계에서 만든 문장을 자동으로 가져왔어요. 고쳐도 좋아요.")
                ),

                    className: "ml-auto self-center px-4 py-2 bg-slate-100 text-slate-500 rounded-2xl font-black text-base hover:bg-slate-200"
                }, "← 처음으로")
            ),

            // 2칸 레이아웃: 왼쪽 = 제목+본문, 오른쪽 = 그림

                // 왼쪽: 제목 + 본문
                h("div", { className: "bg-white p-4 rounded-[2rem] shadow-xl border-4 border-emerald-200 flex flex-col gap-3 overflow-hidden" },
                    h("div", null,
                        h("label", { className: "text-sm font-black text-slate-600 mb-1 block" }, "📝 제목"),
                        h("input", {
                            type: "text",
                            value: title,
                            onChange: function (e) { setTitle(e.target.value); },
                            placeholder: "예) 친구랑 놀았던 날",
                            className: "w-full px-4 py-3 text-xl font-black rounded-xl border-4 border-slate-200 focus:border-emerald-400 outline-none"
                        })
                    ),
                    h("div", { className: "flex-1 flex flex-col" },
                        h("label", { className: "text-sm font-black text-slate-600 mb-1" }, "📓 일기 본문"),
                        h("textarea", {

                            onChange: function (e) { setDiaryText(e.target.value); },

                    initial: { rotateY: 30, opacity: 0 },

                    )

                }, "← 다시 고치기"),

                }, "📮 선생님께 보내기")
            )
        );
    }

    // ───── submit (제출 애니메이션) ─────
    else if (subStep === 'submit') {
        content = h("div", { className: "flex flex-col items-center justify-center h-full p-8 gap-6" },
            h(motion.div, {
                initial: { y: 0, scale: 1, opacity: 1 },

                initial: { opacity: 0 },

    else if (subStep === 'done') {
        content = h("div", { className: "flex flex-col items-center justify-center h-full p-8 gap-5" },
            h(motion.div, {
                initial: { scale: 0, rotate: -180 },
                animate: { scale: 1, rotate: 0 },
                transition: { type: "spring", stiffness: 120 },
                className: "text-9xl"
            }, "🎉"),
            h(motion.h2, {
                initial: { y: 20, opacity: 0 },
                animate: { y: 0, opacity: 1 },
                transition: { delay: 0.2 },
                className: "text-5xl font-black text-emerald-600"
            }, "선생님께 도착했어요!"),
            h("p", { className: "text-2xl font-bold text-slate-600 text-center" },
                "오늘 일기를 모두 완성했어요!", h("br", null),
                "정말 멋진 하루였어요! 🌟"
            ),
            h("div", { className: "bg-emerald-50 px-6 py-3 rounded-full border-2 border-emerald-200 flex items-center gap-3" },
                h("span", { className: "text-3xl" }, "✅"),
                h("span", { className: "text-xl font-black text-emerald-700" }, "「" + title + "」 — 제출 완료")
            ),
            h("button", {
                onClick: function() { if (props.onBack) props.onBack(); else restart(); },
                className: "px-16 py-5 bg-emerald-500 text-white rounded-2xl text-3xl font-black shadow-[0_8px_0_rgb(4,120,87)] active:translate-y-1 active:shadow-none mt-2"
            }, "← 메뉴로 돌아가기")
        );
    }

    return h("div", { className: "h-full w-full bg-[#F0F7FF] flex flex-col" },
        h("div", { className: "px-8 pt-5 pb-2 flex items-center justify-between" },
            h("span", { className: "px-4 py-2 bg-emerald-100 text-emerald-700 rounded-2xl font-black text-base border border-emerald-200" },
                "3단계 — 일기쓰기"
            ),
            h("span", { className: "px-4 py-2 bg-white border-2 border-emerald-300 rounded-2xl font-black text-base text-emerald-700" },
                subStep === 'start' ? "안내" :
                subStep === 'compose' ? "1) 제목·본문·그림" :
                subStep === 'review' ? "2) 미리보기" :
                subStep === 'submit' ? "3) 보내는 중" :
                "끝"
            )
        ),
        h("main", { className: "flex-1 overflow-hidden" }, content)
    );
}

function LoginScreen(props) {
    var onLogin = props.onLogin;

    var s1 = useState([]);          var students = s1[0], setStudents = s1[1];
    var s2 = useState('loading');   var status = s2[0], setStatus = s2[1];
    var s3 = useState('');          var selectedId = s3[0], setSelectedId = s3[1];
    // status: 'loading' | 'ok' | 'error' | 'nogas'

    useEffect(function() {
        var isGasConfigured = GAS_URL.indexOf('여기에') === -1 &&
                              GAS_URL.indexOf('script.google.com') !== -1;
        if (!isGasConfigured) {
            setStudents([
                { id: 1, name: '김민서' },
                { id: 2, name: '이준혁' },
                { id: 3, name: '박소연' },
                { id: 4, name: '최지우' },
                { id: 5, name: '정하은' },
                { id: 6, name: '윤서준' },
            ]);
            setStatus('nogas');
            return;
        }
        gasGet('getStudents')
            .then(function(d) {
                if (d && d.students && d.students.length > 0) {
                    setStudents(d.students);
                    setStatus('ok');
                } else {
                    setStatus('error');
                }
            })
            .catch(function() { setStatus('error'); });
    }, []);

        if (selectedStudent) onLogin(selectedStudent);

                    h("path", { d: "M45 110L60 135L75 110H45Z", fill: "#FBD38D", stroke: "#4A5568", strokeWidth: "2" }),
                    h("path", { d: "M54 125L60 135L66 125H54Z", fill: "#2D3748" }),
                    h("path", { d: "M45 15C45 10 75 10 75 15V30H45V15Z", fill: "#FBB6CE", stroke: "#4A5568", strokeWidth: "2" }),
                    h("circle", { cx: "53", cy: "65", r: "2.5", fill: "#2D3748" }),
                    h("circle", { cx: "67", cy: "65", r: "2.5", fill: "#2D3748" }),
                    h("path", { d: "M56 78C56 78 60 82 64 78", stroke: "#2D3748", strokeWidth: "2", strokeLinecap: "round" })
                )
            ),
            h("h1", { className: "text-5xl font-black text-slate-800" }, "한 문장 일기장 ✏️"),
            h("p", { className: "text-xl font-bold text-slate-500" }, "내 이름을 골라봐요!")
        ),

        // 드롭다운 카드
        h("div", { className: "bg-white rounded-[2.5rem] shadow-2xl border-4 border-amber-200 p-8 w-full max-w-xl flex flex-col gap-5" },

            // 로딩
            status === 'loading' && h("div", { className: "flex flex-col items-center gap-3 py-6" },
                h(motion.div, {

                }, "⏳"),

            // 드롭다운

                // 선택된 학생 프리뷰
                selectedStudent

                }, selectedStudent ? ("시작하기! 🎉") : "이름을 먼저 골라주세요")

            // 에러
            status === 'error' && h("div", { className: "flex flex-col items-center gap-4 py-6" },

                h("p", { className: "text-xl font-black text-slate-600 text-center" },

                ),

            )
        )
    );

// ═══════════════════════════════════════════════
// 최상위 App (라우터)
// ═══════════════════════════════════════════════
function App() {
    // screen: 'login' | 'menu' | 's1_1' | 's1_2' | 's2_1' | 's2_2' | 's3'
    var s1 = useState('login');
    var screen = s1[0], setScreen = s1[1];

    // 로그인된 학생
    var s2 = useState(null);
    var student = s2[0], setStudent = s2[1];

    // 진행 상태 — 학생별로 별도 저장 (key: diary_progress_{studentId})
    var s3 = useState(INIT_PROGRESS);
    var progress = s3[0], setProgress = s3[1];

    function updateProgress(patch) {
        var next = Object.assign({}, progress, patch);
        setProgress(next);
        if (student) lsSet('diary_progress_' + student.id, next);
    }

    function doLogin(st) {
        setStudent(st);
        // 해당 학생의 진행 상태 로드
        var saved = lsGet('diary_progress_' + st.id, null);
        var prog = saved
            ? Object.assign({}, INIT_PROGRESS, saved)
            : Object.assign({}, INIT_PROGRESS, { studentId: st.id, studentName: st.name });
        // 학생 이름 항상 최신으로
        prog.studentName = st.name;
        prog.studentId = st.id;
        setProgress(prog);
        setScreen('menu');
    }

    function goTo(sc) { setScreen(sc); }
    function goMenu() { setScreen('menu'); }
    function goLogin() {
        setStudent(null);
        setProgress(INIT_PROGRESS);
        setScreen('login');
    }

    var content = null;

    if (screen === 'login') {
        content = h(LoginScreen, { onLogin: doLogin });

    } else if (screen === 'menu') {
        content = h(MainMenu, {
            progress: progress,
            onNavigate: function(stageNum, sub) {
                var map = {
                    '1_1': 's1_1', '1_2': 's1_2',
                    '2_1': 's2_1', '2_2': 's2_2',
                    '3':   's3'
                };
                var key = stageNum + (sub ? '_' + sub : '');
                if (map[key]) goTo(map[key]);
            },
            onChangeStudent: goLogin
        });

    } else if (screen === 's1_1') {
        content = h(Stage1_1, {
            onBack: goMenu,
            onComplete: function(newCards) {
                // 카드 수집 기록 → 학습카드 시트
                try {
                    gasPost({
                        type: 'saveCard',
                        studentId: student ? student.id : '',
                        studentName: student ? student.name : '',
                        stage: '1단계❶',
                        cards: Array.isArray(newCards)
                            ? newCards
                            : [{ key: '', value: newCards, emoji: '', group: '' }]
                    }).catch(function(){});
                } catch(e) {}
                updateProgress({ cards1: progress.cards1 + (typeof newCards === 'number' ? newCards : 1) });
                goMenu();
            }
        });

    } else if (screen === 's1_2') {
        content = h(Stage1_2, {
            onBack: goMenu,
            onComplete: function(sentence) {
                // 문장 완성 기록 → 학습문장 시트
                try {
                    gasPost({
                        type: 'saveSentence',
                        studentId: student ? student.id : '',
                        studentName: student ? student.name : '',
                        stage: '1단계❷',
                        sentence1: sentence
                    }).catch(function(){});
                } catch(e) {}
                updateProgress({ did1_2: true, sentence1: sentence });
                goMenu();
            },
            cards1: progress.cards1
        });

    } else if (screen === 's2_1') {
        content = h(Stage2_1, {
            onBack: goMenu,
            onComplete: function(newCards) {
                // 감정 카드 수집 기록 → 학습카드 시트
                try {
                    gasPost({
                        type: 'saveCard',
                        studentId: student ? student.id : '',
                        studentName: student ? student.name : '',
                        stage: '2단계❶',
                        cards: Array.isArray(newCards)
                            ? newCards
                            : [{ key: 'feeling', value: newCards, emoji: '', group: '' }]
                    }).catch(function(){});
                } catch(e) {}
                updateProgress({ cards2: progress.cards2 + (typeof newCards === 'number' ? newCards : 1) });
                goMenu();
            }
        });

    } else if (screen === 's2_2') {
        content = h(Stage2_2, {
            onBack: goMenu,
            onComplete: function(result) {
                // 감정 문장 완성 기록 → 학습문장 시트
                try {
                    gasPost({
                        type: 'saveSentence',
                        studentId: student ? student.id : '',
                        studentName: student ? student.name : '',
                        stage: '2단계❷',
                        sentence2: result
                    }).catch(function(){});
                } catch(e) {}
                updateProgress({ did2_2: true, sentence2: result });
                goMenu();
            },
            cards2: progress.cards2
        });

    } else if (screen === 's3') {
        content = h(Stage3, {
            onBack: goMenu,
            progress: progress,
            gasPost: gasPost
        });
    }

    return h('div', { className: 'h-full w-full relative' }, content);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
