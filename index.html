<script>
// ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★

// framer-motion 로드 실패 시 기본 div로 대체
if (!motion) {
    var _tags = ['div','span','button','a','p','h1','h2','h3','ul','li','section','article'];
    motion = {};
    for (var _ti = 0; _ti < _tags.length; _ti++) {
        (function(tag) {
            motion[tag] = function(props, children) {
                // animate/initial/transition/whileHover/whileTap 제거 후 렌더
                var safeProps = {};
                if (props) {
                    Object.keys(props).forEach(function(k) {
                        if (['animate','initial','transition','whileHover','whileTap','whileFocus','exit','variants'].indexOf(k) === -1) {
                            safeProps[k] = props[k];
                        }
                    });
                }
                return React.createElement(tag, safeProps);
            };
        })(_tags[_ti]);
    }
    console.warn('framer-motion 로드 실패 — 기본 HTML 요소로 대체합니다');
}

// ── localStorage 헬퍼 ──
function lsGet(key, fallback) {
    try { var v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
}
function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

// ── 초기 진행 상태 ──
var INIT_PROGRESS = {

    sentence1: { when: '', where: '', who: '', what: '' },
    sentence2: { feelings: [], reason: '' }
};

// ── 전역 잠금 설정 (GAS 설정 시트에서 로드) ──
var LOCK_SETTINGS = {

// ── GAS 통신 ──
function gasGet(type, params) {
    var url = GAS_URL + '?type=' + type;
    if (params) {
        Object.keys(params).forEach(function(k) {
            url += '&' + k + '=' + encodeURIComponent(params[k]);
        });
    }
    return fetch(url).then(function(r) { return r.json(); });
}
function gasPost(data) {
    return fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
    });
}

// ═══════════════════════════════════════════════

            h("circle", { cx: "53", cy: "65", r: "2.5", fill: "#2D3748" }),
            h("circle", { cx: "67", cy: "65", r: "2.5", fill: "#2D3748" }),

}

var DEMO_STATES = {
    beginner:  { name: '시작 단계',    cards1: 0,  cards2: 0,  did1_2: false, did2_2: false },

var STAGE_DATA = [

        bgGradFrom: '#DBEAFE', bgGradTo: '#BFDBFE',
        innerBg: '#EFF6FF',
        accentBg: '#3B82F6', accentText: '#1E40AF',
        sticker1: '📖', sticker3: '🖊️',
        single: true,
        sub1: '문장 만들러 가기',
        sub2: '',

    },
    {
        number: 3, title: '일기쓰기', subtitle: '오늘 일기를 완성해요',
        char: '📝',
        bgGradFrom: '#A7F3D0', bgGradTo: '#6EE7B7',
        innerBg: '#E0FBF1',
        accentBg: '#10B981', accentText: '#065F46',
        sticker1: '✏️', sticker3: '📮',
        single: true,
        sub1: '일기 쓰러 가기',
        sub2: '',
        shadowClass: 'puffy-shadow-green'
    }
];

function StageCard(props) {
    var stage = props.stage;
    var progress = props.progress || {};
    var onClick = props.onClick;
    var onClickSub1 = props.onClickSub1 || onClick;
    var stageLocked = !!progress.stageLocked;

    return h(motion.div, {
        whileHover: stageLocked ? {} : { scale: 1.03, y: -6 },
        whileTap: stageLocked ? {} : { scale: 0.98 },
        transition: { type: "spring", stiffness: 300, damping: 22 },
        onClick: function() { if (!stageLocked) onClickSub1(); },
        style: { background: 'linear-gradient(160deg, ' + stage.bgGradFrom + ' 0%, ' + stage.bgGradTo + ' 100%)' },
        className: "relative rounded-[2rem] overflow-hidden flex flex-col items-center justify-center cursor-pointer select-none h-full " + stage.shadowClass +
            (stageLocked ? " grayscale opacity-60" : "")
    },
        // 안쪽 테두리 링
        h("div", { className: "absolute inset-2 rounded-[1.75rem] border-4 border-white/40 pointer-events-none" }),

        // 단계 번호 배지
        h("div", {
            className: "absolute top-5 left-1/2 px-5 py-1.5 rounded-full text-base font-black text-white shadow-md",
            style: { background: stage.accentBg, transform: 'translateX(-50%)' }
        }, stage.number + "단계"),

        // 이모지 캐릭터
        h(motion.div, {
            animate: stageLocked ? {} : { y: [0, -8, 0] },
            transition: { repeat: Infinity, duration: 2.5, ease: "easeInOut" },
            className: "mt-14 mb-4"
        },
            h("div", {
                className: "w-28 h-28 rounded-full flex items-center justify-center text-6xl border-4 border-white shadow-xl",
                style: { background: stage.innerBg }
            }, stage.char)
        ),

        // 제목
        h("h3", {
            className: "text-4xl font-black text-center px-4 leading-tight",
            style: { color: stage.accentText }
        }, stage.title),

        // 부제목
        h("p", {
            className: "text-xl font-bold text-center px-5 mt-2 mb-6 leading-snug",
            style: { color: stage.accentText, opacity: 0.8 }
        }, stage.subtitle),

        // 진행 표시
        progress.sub1Count > 0 && h("div", {
            className: "absolute bottom-5 left-5 right-5"
        },
            h("div", { className: "flex justify-between items-center mb-1" },
                h("span", { className: "text-sm font-black", style: { color: stage.accentText } },
                    progress.sub1Done ? "✅ 완료!" : progress.sub1Count + "/" + progress.sub1Total + "장"
                )
            ),
            h("div", { className: "w-full h-3 rounded-full bg-white/50 overflow-hidden" },
                h(motion.div, {
                    initial: { width: 0 },
                    animate: { width: Math.min(100, (progress.sub1Count / Math.max(progress.sub1Total, 1)) * 100) + '%' },
                    transition: { duration: 0.6, ease: "easeOut" },
                    className: "h-full rounded-full",
                    style: { background: stage.accentBg }
                })
            )
        ),

        // 잠금 오버레이
        stageLocked && h("div", { className: "absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-20" },
            h("div", { className: "bg-white px-5 py-4 rounded-3xl shadow-2xl border-4 border-slate-300 text-center" },
                h("div", { className: "text-4xl mb-1" }, "🔒"),
                h("p", { className: "text-lg font-black text-slate-700" }, progress.stageLockReason)
            )
        )
    );
}

// ═══════════════════════════════════════════════
// 공용 컴포넌트 — 각 단계 상단 헤더
// (단계 전환 드롭다운 + 홈 버튼 + 우측 카운터 슬롯)
// ═══════════════════════════════════════════════
var STAGE_OPTIONS = [
    { key: 's1_1', label: '1단계 ❶  카드로 학습', bg: 'bg-amber-100',   text: 'text-amber-700',   border: 'border-amber-200' },
    { key: 's1_2', label: '1단계 ❷  카드로 문장 만들기',    bg: 'bg-red-100',     text: 'text-red-700',     border: 'border-red-200' },
    { key: 's2_1', label: '2단계 ❶  카드로 학습 (감정)',   bg: 'bg-purple-100',  text: 'text-purple-700',  border: 'border-purple-200' },
    { key: 's2_2', label: '2단계 ❷  카드로 문장 만들기',    bg: 'bg-green-100',   text: 'text-green-700',   border: 'border-green-200' },
    { key: 's3',   label: '3단계      일기쓰기',           bg: 'bg-pink-100',    text: 'text-pink-700',    border: 'border-pink-200' }
];

// ═══════════════════════════════════════════════
// 공용 튜토리얼 팝업 (처음 접속 시만 표시)
// ═══════════════════════════════════════════════
function Tutorial(props) {
    var steps = props.steps || [];
    var storageKey = props.storageKey || 'tutorial_done';
    var accentColor = props.accentColor || 'orange';
    var seen = false;
    try { seen = !!localStorage.getItem(storageKey); } catch(e) {}
    var sOpen = useState(!seen);
    var open = sOpen[0], setOpen = sOpen[1];
    var sStep = useState(0);
    var step = sStep[0], setStep = sStep[1];
    var sUserInput = useState('');
    var userInput = sUserInput[0], setUserInput = sUserInput[1];
    var sSelected = useState(null);
    var selected = sSelected[0], setSelected = sSelected[1];

    function close() {
        try { localStorage.setItem(storageKey, '1'); } catch(e) {}
        setOpen(false);
    }
    function next() {
        setUserInput('');
        setSelected(null);
        if (step + 1 < steps.length) setStep(step + 1);
        else close();
    }
    function prev() {
        if (step > 0) { setStep(step - 1); setUserInput(''); setSelected(null); }
    }

    if (!open || steps.length === 0) return null;

    var cur = steps[step];
    var isLast = step === steps.length - 1;

    var colMap = {
        orange:  { ring: '#f97316', btn: '#f97316', shadow: 'rgb(154,52,18)',  light: '#fff7ed', text: '#c2410c', bg: '#ffedd5' },
        purple:  { ring: '#a855f7', btn: '#a855f7', shadow: 'rgb(107,33,168)', light: '#faf5ff', text: '#7e22ce', bg: '#f3e8ff' },
        emerald: { ring: '#10b981', btn: '#10b981', shadow: 'rgb(4,120,87)',   light: '#f0fdf4', text: '#065f46', bg: '#d1fae5' }
    };
    var col = colMap[accentColor] || colMap.orange;

    var action = cur.action || 'none';
    var canProceed = false;
    if (action === 'none') canProceed = true;
    else if (action === 'tap' || action === 'select') canProceed = selected !== null;
    else if (action === 'type') canProceed = userInput.trim().length > 0;
    else if (action === 'notebook') canProceed = userInput === 'done';
    else if (action === 'trafficlight') canProceed = selected !== null;

    // ── 인터랙션 영역 렌더링 ──
    function renderInteraction() {
        // action이 none이어도 preview가 있으면 표시
        if (action === 'none') {
            if (cur.preview) return typeof cur.preview === 'function' ? cur.preview() : cur.preview;
            return null;
        }

        if (action === 'tap' || action === 'select') {
            var options = cur.options || [];
            return h("div", { style: { display:'flex', gap:'0.85rem', justifyContent:'center', flexWrap:'wrap' } },
                options.map(function(opt, i) {
                    var isSel = selected === (opt.value || opt.label);
                    var bgRaw = opt.bg || 'white';
                    return h(motion.button, {
                        key: i,
                        // 선택 전: 노란색 pulse 테두리 애니메이션
                        animate: isSel
                            ? { scale: 1.08, y: -4 }
                            : { scale: [1, 1.02, 1], boxShadow: ['0 0 0 0 rgba(234,179,8,0)', '0 0 0 6px rgba(234,179,8,0.5)', '0 0 0 0 rgba(234,179,8,0)'] },
                        transition: isSel
                            ? { type: 'spring', stiffness: 400, damping: 20 }
                            : { repeat: Infinity, duration: 1.5 },
                        onClick: (function(val) { return function() {
                            setSelected(val);
                            if (action === 'tap') setTimeout(function() { next(); }, 300);
                        }; })(opt.value || opt.label),
                        style: {
                            background: isSel ? col.btn : bgRaw,
                            color: isSel ? 'white' : (opt.color || '#374151'),
                            padding: '1rem 1.8rem',
                            borderRadius: '1.25rem',
                            fontWeight: 900,
                            fontSize: '1.5rem',
                            // 선택 전: 노란색 테두리, 선택 후: 액센트 테두리
                            border: isSel
                                ? ('4px solid ' + col.btn)
                                : '4px solid #EAB308',
                            cursor: 'pointer',
                            transition: 'all 0.2s',
                            boxShadow: isSel
                                ? ('0 8px 20px ' + col.btn + '55')
                                : '0 3px 12px rgba(234,179,8,0.35)',
                            display: 'flex', alignItems: 'center', gap: '0.55rem'
                        }
                    },
                        opt.emoji && h("span", { style: { fontSize: '1.8rem' } }, opt.emoji),
                        h("span", null, opt.label)
                    );
                })
            );
        }

        if (action === 'trafficlight') {
            var lights = [
                { g: 'red',    label: '속상하거나\n화나는 마음', color: '#EF4444', glow: 'rgba(239,68,68,0.7)'  },
                { g: 'yellow', label: '평범하거나\n궁금한 마음', color: '#F59E0B', glow: 'rgba(245,158,11,0.7)' },
                { g: 'green',  label: '기쁘고\n즐거운 마음',    color: '#10B981', glow: 'rgba(16,185,129,0.7)' }
            ];
            return h("div", { style: { background:'#1e293b', borderRadius:'2.5rem', padding:'1.2rem 2rem', display:'flex', gap:'2rem', justifyContent:'center', alignItems:'flex-end' } },
                lights.map(function(item) {
                    var isActive = selected === item.g;

function Confetti(props) {
    var show = props.show;
    if (!show) return null;

    // 폭죽 조각 30개 — 색·크기·각도 랜덤
    var colors = ['#F87171', '#FB923C', '#FBBF24', '#FACC15', '#34D399', '#22D3EE', '#60A5FA', '#A78BFA', '#F472B6'];
    var pieces = [];
    for (var i = 0; i < 30; i++) {
        var angle = (Math.PI * 2 * i) / 30 + (Math.random() - 0.5) * 0.4;
        var distance = 280 + Math.random() * 200;
        pieces.push({
            id: i,
            color: colors[i % colors.length],
            dx: Math.cos(angle) * distance,
            dy: Math.sin(angle) * distance - 100, // 살짝 위로
            rot: Math.random() * 720,
            size: 10 + Math.random() * 8,
            delay: Math.random() * 0.15
        });
    }

    return h("div", {
        className: "fixed inset-0 pointer-events-none flex items-center justify-center",
        style: { zIndex: 9999 }
    },
        // 중앙 큰 이모지
        h(motion.div, {
            initial: { scale: 0, rotate: -180 },
            animate: { scale: [0, 1.3, 1], rotate: 0 },
            transition: { duration: 0.6, times: [0, 0.5, 1] },
            className: "text-9xl",
            style: { filter: 'drop-shadow(0 0 30px rgba(251, 191, 36, 0.6))' }
        }, "🎉"),
        // 폭죽 조각들
        pieces.map(function(p) {
            return h(motion.div, {
                key: p.id,
                initial: { x: 0, y: 0, opacity: 1, rotate: 0, scale: 1 },
                animate: { x: p.dx, y: p.dy + 400, opacity: 0, rotate: p.rot, scale: 0.5 },
                transition: { duration: 1.5, delay: p.delay, ease: [0.2, 0.8, 0.4, 1] },
                className: "absolute rounded-sm",
                style: {
                    width: p.size + 'px',
                    height: p.size + 'px',
                    background: p.color,
                    boxShadow: '0 0 12px ' + p.color
                }
            });
        })
    );
}

// 한 문장을 4영역으로 받아서, 글자별로 색을 매칭해 10칸 공책에 그리기
function buildCellGrid(parts) {
    // parts = [언제, 어디서, 누구와, 무엇을]
    // 결과: [{ ch: '오', color: 'when' }, ...]
    var keys = ['when', 'where', 'who', 'what', 'feeling'];
    var cells = [];
    for (var i = 0; i < parts.length; i++) {
        var word = parts[i];
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') {
                cells.push({ ch: '', color: null, isSpace: true });
            } else {
                cells.push({ ch: ch, color: keys[i] });
            }
        }
        // 어절 사이 공백 (마지막 어절 뒤에는 없음)
        if (i < parts.length - 1) {
            cells.push({ ch: '', color: null, isSpace: true });
        }
    }
    // 문장 끝 마침표 (마지막 어절의 색상과 동일하게)
    var lastColor = null;
    for (var li = cells.length - 1; li >= 0; li--) {
        if (cells[li].color) { lastColor = cells[li].color; break; }
    }
    cells.push({ ch: '.', color: lastColor, isPeriod: true });
    return cells;
}

// 공책 칸 그리기 (cells = 글자 배열, 칸당 10개씩 줄바꿈)
// 줄 수에 따라 칸 크기를 자동 조절: 1~2줄=큼, 3줄=중간, 4줄+=작음
function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;
    // 첫 줄 들여쓰기: 첫 칸 빈 칸 추가
    var paddedCells = [{ ch: '', color: null, isEmpty: true }].concat(cells);
    // 줄바꿈 자리에 공백 칸(isSpace)이 오면 제거 → 다음 줄 첫 칸부터 시작
    var packed = [];
    var col = 0;
    for (var pi = 0; pi < paddedCells.length; pi++) {
        var cellP = paddedCells[pi];
        // 줄 시작(col===0)이고 공백 칸이면 건너뛰기
        if (col === 0 && cellP.isSpace) continue;
        packed.push(cellP);
        col++;
        if (col >= perRow) col = 0;
    }
    var rows = [];
    for (var i = 0; i < packed.length; i += perRow) {
        rows.push(packed.slice(i, i + perRow));
    }
    // 마지막 줄이 10칸 미만이면 빈 칸으로 채워서 시각적 정렬
    while (rows[rows.length - 1].length < perRow) {
        rows[rows.length - 1].push({ ch: '', color: null, isEmpty: true });
    }

    // 줄 수에 따라 셀 크기 결정 (가독성과 화면 맞춤의 균형)
    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) {
        cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3';
    } else if (lineCount === 3) {
        cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2';
    } else {
        // 4줄 이상
        cellSize = 'w-14 h-14'; textSize = 'text-2xl'; gap = 'gap-2';
    }

    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {
                    var bgClass = 'bg-white';
                    var textClass = 'text-slate-700';
                    var borderClass = 'border-slate-300';
                    if (cell.color) {
                        var c = FIELD_COLORS[cell.color];
                        bgClass = c.bg;
                        textClass = c.text;
                        borderClass = c.border;
                    }
                    if (cell.isSpace) {
                        // 빈 칸(띄어쓰기): 옅은 회색
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-200 border-dashed';
                    }
                    if (cell.isEmpty) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-100';
                    }
                    // 마침표: 왼쪽 아래에 크게 표시, 마지막 어절 색상 사용
                    if (cell.isPeriod) {
                        var periodColor = '#475569';
                        var periodBg = 'bg-slate-50';
                        var periodBorder = 'border-slate-200';
                        if (cell.color && FIELD_COLORS[cell.color]) {
                            var pfc = FIELD_COLORS[cell.color];
                            periodBg = pfc.bg;
                            periodBorder = pfc.border;
                            // text 색상에서 hex 추출 (tailwind class → inline style 불가, style로 지정)
                            var colorMap = {
                                'when':'#92400e','where':'#1e40af','who':'#065f46',
                                'what':'#991b1b','feeling':'#5b21b6'
                            };
                            periodColor = colorMap[cell.color] || '#475569';
                        }
                        return h("div", {
                            key: ci,
                            className: cellSize + " border-4 rounded-xl shadow-sm flex items-end justify-start " + periodBg + " " + periodBorder
                        },
                            h("span", {
                                style: { fontSize: '2.8rem', fontWeight: 900, color: periodColor, lineHeight: 1, paddingLeft: '0.3rem', paddingBottom: '0.1rem' }
                            }, ".")
                        );
                    }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass
                    }, cell.ch);
                })
            );
        })
    );
}

// ───── 음성 비교 헬퍼 ─────
// 비교용 정규화: 공백 제거, 조사 일부 제거 (1-2학년 발음 차이 흡수)
function normalize(s) {
    if (!s) return '';
    var t = String(s).toLowerCase();
    // 모든 공백/특수문자 제거
    t = t.replace(/[\s.,!?~'"`\-_]+/g, '');
    return t;
}

// 한 요소(예: '학교에서')가 음성에 포함되는지 검사
// 어절 핵심부 추출 후 매칭 (조사 변동 흡수)
function fieldMatched(transcript, target) {
    var nT = normalize(transcript);
    var nTarget = normalize(target);
    if (!nT || !nTarget) return false;

    // 1) 직접 포함되면 OK
    if (nT.indexOf(nTarget) !== -1) return true;

    // 2) 어간 추출 비교: 대상에서 흔한 어미/조사 제거 후 비교
    //    "학교에서" → "학교", "친구랑" → "친구", "반갑게 인사했다" → "반갑게인사"
    var trimmed = nTarget
        .replace(/(에서|에게|이랑|랑|이|가|을|를|은|는|와|과|께|에)$/g, '')
        .replace(/(했다|했어요|했어|했지|한다)$/g, '하')
        .replace(/(었다|었어요|었어|었지)$/g, '');
    if (trimmed.length >= 2 && nT.indexOf(trimmed) !== -1) return true;

    // 3) 글자 단위 부분 일치: 대상의 70% 이상 문자가 순서대로 나타나면 OK
    //    (음성 인식 오류 흡수용)
    if (nTarget.length >= 2) {
        var matched = 0, idx = 0;
        for (var i = 0; i < nTarget.length; i++) {
            var pos = nT.indexOf(nTarget.charAt(i), idx);
            if (pos !== -1) { matched++; idx = pos + 1; }
        }
        if (matched / nTarget.length >= 0.7) return true;
    }
    return false;
}

// 예시문장 4요소가 각각 음성에 들어갔는지 검사
// ═══════════════════════════════════════════════
// 한국어 TTS (자연스러운 Google/Neural 음성 우선)
// ═══════════════════════════════════════════════
var _ttsCache = { voice: null, ready: false };

function _selectKoreanVoice() {
    if (!window.speechSynthesis) return null;
    var voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return null;

    // 1순위: Google 한국어 (클라우드 음성, 가장 자연스러움)
    var v1 = voices.find(function(v) {
        return v.lang === 'ko-KR' &&
               v.name.toLowerCase().indexOf('google') !== -1 &&
               !v.localService;
    });
    if (v1) return v1;

    // 2순위: Wavenet/Neural2 (Google Cloud)
    var v2 = voices.find(function(v) {
        return v.lang === 'ko-KR' &&
               (v.name.indexOf('Wavenet') !== -1 || v.name.indexOf('Neural') !== -1);
    });
    if (v2) return v2;

    // 3순위: 자연스러움 키워드
    var v3 = voices.find(function(v) {
        return v.lang === 'ko-KR' &&
               /wavenet|neural|premium|enhanced|natural/i.test(v.name);
    });
    if (v3) return v3;

    // 4순위: 그냥 ko-KR
    var v4 = voices.find(function(v) { return v.lang === 'ko-KR'; });
    if (v4) return v4;

    // 5순위: 한국어 비슷한 것
    return voices.find(function(v) { return v.lang && v.lang.indexOf('ko') === 0; }) || null;
}

// 음성 목록 로드 (브라우저마다 비동기로 로드됨)
if (window.speechSynthesis) {
    var loadVoices = function() {
        _ttsCache.voice = _selectKoreanVoice();
        _ttsCache.ready = true;
    };
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
}

// 음성 재생
function speakKorean(text, opts) {
    if (!text || !window.speechSynthesis) return;
    opts = opts || {};
    // 진행 중인 발화 중지
    window.speechSynthesis.cancel();

    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.pitch = opts.pitch != null ? opts.pitch : 1.0;  // 기본 1.0
    utter.rate = opts.rate != null ? opts.rate : 0.95;    // 약간 천천히, 자연스럽게
    utter.volume = opts.volume != null ? opts.volume : 1.0;

    var voice = _ttsCache.voice || _selectKoreanVoice();
    if (voice) utter.voice = voice;

    if (opts.onstart) utter.onstart = opts.onstart;
    if (opts.onend) utter.onend = opts.onend;

    window.speechSynthesis.speak(utter);
    return utter;
}

// 듣기 버튼 컴포넌트
function ListenButton(props) {
    var text = props.text || '';

function checkAllFields(transcript, exampleParts) {
    // exampleParts = [언제, 어디서, 누구와, 무엇을]
    var keys = ['when', 'where', 'who', 'what', 'feeling'];
    var result = {};
    for (var i = 0; i < 4; i++) {
        result[keys[i]] = fieldMatched(transcript, exampleParts[i]);
    }
    return result;
}

function Stage1_1(props) {
    // subStep: 'category' → 'draw' → 'flip' → 'study' (5회) → 'record' (5회) → 'choose' → 'write' → 'complete'
    var st1 = useState('category'); var subStep = st1[0], setSubStep = st1[1];
    var st2 = useState(null);       var selectedCat = st2[0], setSelectedCat = st2[1];
    var st3 = useState(null);       var drawn = st3[0], setDrawn = st3[1];
    var st4 = useState(0);          var exampleIdx = st4[0], setExampleIdx = st4[1];
    var st5 = useState(false);      var recording = st5[0], setRecording = st5[1];
    var st5b = useState(false);     var hasTriedRecording = st5b[0], setHasTriedRecording = st5b[1];
    var st6 = useState('');         var transcript = st6[0], setTranscript = st6[1];
    var st7 = useState(props.collectedCards || []);  var collected = st7[0], setCollected = st7[1];
    var st8 = useState(null);       var chosenForWriting = st8[0], setChosenForWriting = st8[1];
    var st9  = useState(false);      var showConfetti = st9[0], setShowConfetti = st9[1];
    var st10 = useState(false);      var mustRetry = st10[0], setMustRetry = st10[1];
    var st11 = useState([]);         var finalCards = st11[0], setFinalCards = st11[1]; // 완료 시 전달할 카드 목록
    // 감정 더하기 state (훅 규칙: 함수 최상단에 선언)
    var stFG = useState('red');      var feelGroup = stFG[0], setFeelGroup = stFG[1];
    var stFP = useState([]);         var feelPicked = stFP[0], setFeelPicked = stFP[1];
    var stPending = useState(null);  var pendingFeel = stPending[0], setPendingFeel = stPending[1]; // 팝업 확인용
    var recRef = useRef(null);

    // 감정 더하기 토글
    function toggleFeel(f) {
        var w = f.value || '';
        var idx = feelPicked.indexOf(w);
        if (idx >= 0) { var n = feelPicked.slice(); n.splice(idx, 1); setFeelPicked(n); }
        else setFeelPicked(feelPicked.concat([w]));
    }

    // examples: drawn 단어에 맞는 예시문장 배열
    var examples = (function() {
        if (!drawn) return [];
        var found = DEMO_EXAMPLES_TABLE[drawn.value];

        // 유효성 검증: 4요소 문자열 배열인지
        function isValid(rows) {
            if (!rows || !Array.isArray(rows) || rows.length === 0) return false;
            return rows.every(function(row) {
                return Array.isArray(row) && row.length >= 4 &&
                       row[0] && row[1] && row[2] && row[3];
            });
        }

        if (isValid(found)) return found;

        // 자동 생성: 선택한 카테고리 단어를 포함한 예시 3개
        var catIdx = { when: 0, where: 1, who: 2, what: 3 }[selectedCat] || 0;
        var bases = [
            ['오늘',       '교실에서',   '친구랑',   '재미있게 놀았다'],
            ['학교 끝나고', '운동장에서', '친구들과', '신나게 놀았다'],
            ['쉬는 시간에', '도서관에서', '혼자서',   '책을 읽었다']
        ];
        return bases.map(function(base) {
            var row = base.slice();
            row[catIdx] = drawn.value;
            return row;
        });
    })();
    var currentExample = examples[exampleIdx];

    function selectCategory(cat) {
        setSelectedCat(cat);
        setSubStep('draw');
    }
    function pickCard(card) {
        setDrawn(card);
        setSubStep('flip');
    }
    function confirmCard() { setSubStep('record'); }
    function toRecord() { setSubStep('record'); }

    function toggleRec() {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { alert("Chrome을 사용해 주세요!"); return; }
        if (!recRef.current) {
            var r = new SR();
            r.lang = 'ko-KR'; r.interimResults = true; r.continuous = true;
            r.onstart = function () { setRecording(true); };
            r.onend = function () { setRecording(false); };
            r.onerror = function () { setRecording(false); };
            r.onresult = function (e) {
                var t = '';
                for (var i = 0; i < e.results.length; i++) {
                    t += e.results[i][0].transcript;
                }
                setTranscript(t);
            };
            recRef.current = r;
        }
        if (recording) recRef.current.stop();
        else { setTranscript(''); setHasTriedRecording(true); setMustRetry(false); try { recRef.current.start(); } catch (er) {} }
    }

    // 녹음 종료 시 매칭 결과 처리 (폭죽 / 재녹음 강제)
    useEffect(function() {
        if (!transcript || recording) return;
        // currentExample 없으면 그냥 전반적으로 OK 처리
        var count;
        if (!currentExample) {
            // 예시 없으면 녹음만 했으면 통과
            count = 4;
        } else {
            var result = checkAllFields(transcript, currentExample);
            count = (result.when?1:0) + (result.where?1:0) + (result.who?1:0) + (result.what?1:0);

// 한 문장을 4영역으로 받아서, 글자별로 색을 매칭해 10칸 공책에 그리기
function buildCellGrid(parts) {
    var keys = FIELD_KEYS;
    var cells = [];
    for (var i = 0; i < parts.length; i++) {
        var word = parts[keys[i]];
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') {
                cells.push({ ch: '', color: null, isSpace: true });
            } else {
                cells.push({ ch: ch, color: keys[i] });
            }
        }
        if (i < parts.length - 1) {
            cells.push({ ch: '', color: null, isSpace: true });
        }
    }
    // 문장 끝 마침표 (마지막 어절의 색상과 동일하게)
    var lastColor = null;
    for (var li = cells.length - 1; li >= 0; li--) {
        if (cells[li].color) { lastColor = cells[li].color; break; }
    }
    cells.push({ ch: '.', color: lastColor, isPeriod: true });
    return cells;
}

// 공책 칸 그리기 (cells = 글자 배열, 칸당 10개씩 줄바꿈)
function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;
    // 첫 줄 들여쓰기: 첫 칸 빈 칸 추가
    var paddedCells = [{ ch: '', color: null, isEmpty: true }].concat(cells);
    // 줄바꿈 자리에 공백 칸(isSpace)이 오면 제거 → 다음 줄 첫 칸부터 시작
    var packed = [];
    var col = 0;
    for (var pi = 0; pi < paddedCells.length; pi++) {
        var cellP = paddedCells[pi];
        if (col === 0 && cellP.isSpace) continue;
        packed.push(cellP);
        col++;
        if (col >= perRow) col = 0;
    }
    var rows = [];
    for (var i = 0; i < packed.length; i += perRow) {
        rows.push(packed.slice(i, i + perRow));
    }
    while (rows[rows.length - 1].length < perRow) {
        rows[rows.length - 1].push({ ch: '', color: null, isEmpty: true });
    }

    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) {
        cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3';
    } else if (lineCount === 3) {
        cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2';
    } else {
        cellSize = 'w-14 h-14'; textSize = 'text-2xl'; gap = 'gap-2';
    }

    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {
                    var bgClass = 'bg-white';
                    var textClass = 'text-slate-700';
                    var borderClass = 'border-slate-300';
                    if (cell.color) {
                        var c = FIELD_COLORS[cell.color];
                        bgClass = c.bg;
                        textClass = c.text;
                        borderClass = c.border;
                    }
                    if (cell.isSpace) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-200 border-dashed';
                    }
                    if (cell.isEmpty) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-100';
                    }
                    // 마침표: 왼쪽 아래에 크게 표시, 마지막 어절 색상 사용
                    if (cell.isPeriod) {
                        var periodColor = '#475569';
                        var periodBg = 'bg-slate-50';
                        var periodBorder = 'border-slate-200';
                        if (cell.color && FIELD_COLORS[cell.color]) {
                            var pfc = FIELD_COLORS[cell.color];
                            periodBg = pfc.bg;
                            periodBorder = pfc.border;
                            // text 색상에서 hex 추출 (tailwind class → inline style 불가, style로 지정)
                            var colorMap = {
                                'when':'#92400e','where':'#1e40af','who':'#065f46',
                                'what':'#991b1b','feeling':'#5b21b6'
                            };
                            periodColor = colorMap[cell.color] || '#475569';
                        }
                        return h("div", {
                            key: ci,
                            className: cellSize + " border-4 rounded-xl shadow-sm flex items-end justify-start " + periodBg + " " + periodBorder
                        },
                            h("span", {
                                style: { fontSize: '2.8rem', fontWeight: 900, color: periodColor, lineHeight: 1, paddingLeft: '0.3rem', paddingBottom: '0.1rem' }
                            }, ".")
                        );
                    }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass
                    }, cell.ch);
                })
            );

// "무엇을" 문구(+선택적으로 문장 전체)에서 추천 감정 찾기
function findRecommendedFeelings(whatText, fullSentence) {
    var results = [];
    // whatText가 없으면 빈 배열
    if (!whatText && !fullSentence) return results;

    // 검색 대상: 무엇을 필드 + (없으면) 문장 전체
    var targets = [];
    if (whatText) targets.push(String(whatText).replace(/\s+/g, ''));
    if (fullSentence) targets.push(String(fullSentence).replace(/\s+/g, ''));

    Object.keys(RECOMMENDED_FEELINGS).forEach(function(key) {
        var matched = targets.some(function(t) { return t.indexOf(key) !== -1; });
        if (matched) {
            RECOMMENDED_FEELINGS[key].forEach(function(f) {
                if (results.indexOf(f) === -1) results.push(f);
            });
        }
    });
    return results;
}



// ────── 음성 비교 헬퍼 (1단계와 동일) ──────
function normalize(s) {
    if (!s) return '';
    var t = String(s).toLowerCase();
    t = t.replace(/[\s.,!?~'"`\-_]+/g, '');
    return t;
}
function fieldMatched(transcript, target) {
    var nT = normalize(transcript);
    var nTarget = normalize(target);
    if (!nT || !nTarget) return false;
    if (nT.indexOf(nTarget) !== -1) return true;
    var trimmed = nTarget
        .replace(/(에서|에게|이랑|랑|이|가|을|를|은|는|와|과|께|에)$/g, '')
        .replace(/(했다|했어요|했어|했지|한다)$/g, '하')
        .replace(/(었다|었어요|었어|었지)$/g, '');
    if (trimmed.length >= 2 && nT.indexOf(trimmed) !== -1) return true;
    if (nTarget.length >= 2) {
        var matched = 0, idx = 0;
        for (var i = 0; i < nTarget.length; i++) {
            var pos = nT.indexOf(nTarget.charAt(i), idx);
            if (pos !== -1) { matched++; idx = pos + 1; }
        }
        if (matched / nTarget.length >= 0.7) return true;
    }
    return false;
}
function checkAllFields(transcript, parts) {
    var keys = FIELD_KEYS;
    var result = {};
    for (var i = 0; i < keys.length; i++) {
        result[keys[i]] = fieldMatched(transcript, parts[i]);
    }
    return result;
}

// 공책 칸 셀
function buildCellGrid(parts) {
    var keys = FIELD_KEYS;
    var cells = [];
    for (var i = 0; i < parts.length; i++) {
        var word = parts[i];
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') cells.push({ ch: '', color: null, isSpace: true });
            else cells.push({ ch: ch, color: keys[i] });
        }
        if (i < parts.length - 1) cells.push({ ch: '', color: null, isSpace: true });
    }
    // 문장 끝 마침표 (마지막 어절의 색상과 동일하게)
    var lastColor = null;
    for (var li = cells.length - 1; li >= 0; li--) {
        if (cells[li].color) { lastColor = cells[li].color; break; }
    }
    cells.push({ ch: '.', color: lastColor, isPeriod: true });
    return cells;
}

// 공책 그리기 (1단계와 동일)
function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;

    // ── 첫 줄 앞에 빈 칸 하나 삽입 ──
    var paddedCells = [{ ch:'', color:null, isEmpty:true }].concat(cells);

    // 줄바꿈 자리에 공백 칸(isSpace)이 오면 제거 → 다음 줄 첫 칸부터 시작
    var packed = [];
    var col = 0;
    for (var pi = 0; pi < paddedCells.length; pi++) {
        var cellP = paddedCells[pi];
        if (col === 0 && cellP.isSpace) continue;
        packed.push(cellP);
        col++;
        if (col >= perRow) col = 0;
    }

    var rows = [];
    for (var i = 0; i < packed.length; i += perRow) rows.push(packed.slice(i, i + perRow));
    // 마지막 줄 빈 칸 채우기
    while (rows[rows.length - 1].length < perRow) rows[rows.length - 1].push({ ch:'', color:null, isEmpty:true });

    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) { cellSize = 'w-24 h-24'; textSize = 'text-5xl'; gap = 'gap-4'; }
    else if (lineCount === 3) { cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3'; }
    else { cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2'; }
    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {
                    var bgClass = 'bg-white', textClass = 'text-slate-700', borderClass = 'border-slate-300';
                    if (cell.color) { var c = FIELD_COLORS[cell.color]; bgClass = c.bg; textClass = c.text; borderClass = c.border; }
                    if (cell.isSpace) { bgClass = 'bg-slate-50'; borderClass = 'border-slate-200 border-dashed'; }
                    if (cell.isEmpty) { bgClass = 'bg-slate-50'; borderClass = 'border-slate-100'; }
                    if (cell.isPeriod) {
                        var periodColor3 = '#475569';
                        var periodBg3 = 'bg-slate-50';
                        var periodBorder3 = 'border-slate-200';
                        if (cell.color && FIELD_COLORS[cell.color]) {
                            var pfc3 = FIELD_COLORS[cell.color];
                            periodBg3 = pfc3.bg;
                            periodBorder3 = pfc3.border;
                            var colorMap3 = {
                                'when':'#92400e','where':'#1e40af','who':'#065f46',
                                'what':'#991b1b','feeling':'#5b21b6'
                            };
                            periodColor3 = colorMap3[cell.color] || '#475569';
                        }
                        return h("div", {
                            key: ci,
                            className: cellSize + " border-4 rounded-xl shadow-sm flex items-end justify-start " + periodBg3 + " " + periodBorder3
                        },
                            h("span", {
                                style: { fontSize: '2.8rem', fontWeight: 900, color: periodColor3, lineHeight: 1, paddingLeft: '0.3rem', paddingBottom: '0.1rem' }
                            }, ".")
                        );
                    }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass
                    }, cell.ch);
                })
            );
        })
    );
}

        { emoji: '🎡', text: '신나다', group: 'green' },

    ],

    did2_2: true    // 2단계-2 (감정 문장) 완료 여부
};

// 감정들을 자연스럽게 연결 ("기쁘다, 신나다" → "기쁘고 신났다" 또는 "기쁘면서 신났다")
function joinFeelings(feelings) {
    if (!feelings || feelings.length === 0) return '';
    if (feelings.length === 1) return feelings[0].text;
    // "다"로 끝나는 단어를 자연스럽게 연결
    var parts = feelings.map(function (f, i) {
        if (i === feelings.length - 1) return f.text;
        // 중간 감정들은 "~고" 형태로
        var t = f.text;
        // "다"로 끝나면 "고"로 바꾸기
        if (/다$/.test(t)) {
            return t.replace(/다$/, '고');
        }
        return t;
    });
    return parts.join(' ');
}

// 일기 본문 자동 생성: 1단계-2 + 2단계-2 결과 합치기
function composeDiaryText(d) {
    var parts = d.baseParts;
    // 1단계-2 결과
    var s1 = parts.when + ' ' + parts.where + ' ' + parts.who + ' ' + parts.what + '.';
    // 2단계-2 결과 (감정 + 이유)
    var feelingText = joinFeelings(d.feelings);
    var s2 = '그래서 ' + feelingText + '.';
    var reasonClean = (d.reason || '').trim();
    if (!/[.!?。]$/.test(reasonClean)) reasonClean += '.';
    var s3 = '왜냐하면 ' + reasonClean;
    return s1 + ' ' + s2 + ' ' + s3;
}

// 캔버스 그림판
function DrawBoard(props) {
    var canvasRef = useRef(null);
    var s = useState(false); var drawing = s[0], setDrawing = s[1];
    var s2 = useState('#1e40af'); var color = s2[0], setColor = s2[1];
    var s3 = useState(4); var thickness = s3[0], setThickness = s3[1];

    var COLORS = ['#1e40af', '#dc2626', '#16a34a', '#ca8a04', '#a855f7', '#000000'];

    function getPos(e, canvas) {
        var rect = canvas.getBoundingClientRect();
        var sx = canvas.width / rect.width;
        var sy = canvas.height / rect.height;
        var clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        var clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
        return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
    }

    function start(e) {
        e.preventDefault();
        var canvas = canvasRef.current;
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var p = getPos(e, canvas);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = thickness;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        setDrawing(true);
    }
    function move(e) {
        if (!drawing) return;
        e.preventDefault();
        var canvas = canvasRef.current;
        var ctx = canvas.getContext('2d');
        var p = getPos(e, canvas);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    }
    function end() { setDrawing(false); }
    function clear() {
        var canvas = canvasRef.current;
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 흰 배경 다시 깔기
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 첫 렌더 시 흰 배경
    useEffect(function () {
        var canvas = canvasRef.current;
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }, []);

    // 외부에서 그림 데이터 가져갈 수 있게
    useEffect(function () {
        if (props.canvasRefOut) props.canvasRefOut(canvasRef.current);
    });

    return h("div", { className: "flex flex-col gap-2" },
        // 도구
        h("div", { className: "flex items-center gap-2 flex-wrap" },
            // 색
            h("div", { className: "flex gap-1" },
                COLORS.map(function (c) {
                    return h("button", {
                        key: c,
                        onClick: function () { setColor(c); },
                        style: { backgroundColor: c },
                        className: "w-8 h-8 rounded-full border-2 " + (color === c ? "border-slate-800 ring-2 ring-slate-300" : "border-white shadow")
                    });
                })
            ),
            // 굵기
            h("div", { className: "flex gap-1 ml-2" },
                [2, 4, 8].map(function (t) {
                    return h("button", {
                        key: t,
                        onClick: function () { setThickness(t); },
                        className: "w-8 h-8 rounded-full border-2 flex items-center justify-center " +
                            (thickness === t ? "border-slate-800 bg-slate-100" : "border-slate-200 bg-white")
                    },
                        h("div", {
                            style: { width: t * 2, height: t * 2, backgroundColor: '#1e293b' },
                            className: "rounded-full"
                        })
                    );
                })
            ),
            // 지우기
            h("button", {
                onClick: clear,
                className: "ml-auto px-3 py-1 bg-red-100 text-red-600 rounded-xl text-sm font-black border-2 border-red-200 hover:bg-red-200"
            }, "🗑️ 지우기")
        ),
        // 캔버스
        h("canvas", {
            ref: canvasRef,
            width: 600,
            height: 320,
            className: "draw-board border-4 border-slate-300 rounded-2xl bg-white shadow-inner w-full",
            onMouseDown: start,
            onMouseMove: move,
            onMouseUp: end,
            onMouseLeave: end,
            onTouchStart: start,
            onTouchMove: move,
            onTouchEnd: end
        })
    );
}

function MicPermissionScreen(props) {
    var studentName = props.studentName || '';
    var onDone = props.onDone || function(){};

    var st1 = useState('idle'); // 'idle' | 'granted' | 'denied'
    var micState = st1[0], setMicState = st1[1];

    function requestMic() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            // 브라우저 미지원
            setMicState('denied');
            return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                // 허용 — 스트림 즉시 정지 (권한만 확인)
                stream.getTracks().forEach(function(t) { t.stop(); });
                setMicState('granted');
                // 1.5초 후 메뉴로 자동 이동
                setTimeout(onDone, 1500);
            })
            .catch(function() {
                setMicState('denied');
            });
    }

    return h("div", {
        className: "w-full flex flex-col items-center justify-center overflow-hidden",
        style: {
            height: '100dvh',
            background: 'linear-gradient(160deg, #FFF8E7 0%, #F0F4FF 40%, #FFF0F5 100%)'
        }
    },
        h(motion.div, {
            initial: { scale: 0.9, opacity: 0 },
            animate: { scale: 1, opacity: 1 },
            transition: { duration: 0.4 },
            className: "bg-white rounded-[2.5rem] shadow-2xl border-4 border-orange-200 p-8 mx-4 w-full max-w-lg flex flex-col items-center gap-6 text-center"
        },
            // 아이콘
            h(motion.div, {
                animate: micState === 'idle'
                    ? { scale: [1, 1.1, 1] }
                    : micState === 'granted'
                        ? { scale: [1, 1.3, 1], rotate: [0, 10, -10, 0] }
                        : {},
                transition: { repeat: micState === 'idle' ? Infinity : 0, duration: 2 },
                className: "text-8xl"
            },
                micState === 'granted' ? "🎉" :
                micState === 'denied'  ? "😢" : "🎤"
            ),

            // 제목
            h("div", { className: "flex flex-col gap-2" },
                h("h1", { className: "text-3xl font-black text-slate-800" },
                    micState === 'granted' ? "마이크 준비 완료!" :
                    micState === 'denied'  ? "마이크를 허용해주세요" :
                    studentName + " 학생, 반가워요! 👋"
                ),
                h("p", { className: "text-xl font-bold text-slate-500 leading-relaxed" },
                    micState === 'granted'
                        ? "이제 말하기 활동을 시작할 수 있어요! 잠깐 기다려요..."
                        : micState === 'denied'
                            ? "브라우저 주소창 옆 🔒 아이콘을 눌러서 마이크를 허용해주세요."
                            : "이 앱은 말하기 연습을 위해 마이크가 필요해요. 아래 버튼을 눌러 허용해주세요!"
                )
            ),

            // 버튼들
            micState === 'idle' && h("div", { className: "flex flex-col gap-3 w-full" },
                h(motion.button, {
                    whileHover: { scale: 1.03 },
                    whileTap: { scale: 0.97 },
                    onClick: requestMic,
                    className: "w-full py-5 rounded-2xl text-2xl font-black text-white bg-red-500 shadow-[0_6px_0_rgb(185,28,28)] active:translate-y-1 active:shadow-none"
                }, "🎤 마이크 허용하기"),
                h("button", {
                    onClick: onDone,
                    className: "w-full py-3 rounded-2xl text-lg font-bold text-slate-400 bg-slate-50 border-2 border-slate-200 hover:bg-slate-100"
                }, "마이크 없이 계속하기")
            ),

            micState === 'granted' && h(motion.div, {
                initial: { scale: 0 },
                animate: { scale: 1 },
                className: "w-full py-4 rounded-2xl text-2xl font-black text-white bg-emerald-500 text-center"
            }, "✅ 허용 완료! 메뉴로 이동 중..."),

            micState === 'denied' && h("div", { className: "flex flex-col gap-3 w-full" },
                h("div", {
                    className: "bg-red-50 rounded-2xl p-4 border-2 border-red-200 text-left"
                },
                    h("p", { className: "text-base font-bold text-red-700" },
                        "📋 허용 방법:", h("br", null),
                        "1. 브라우저 주소창 왼쪽 🔒 클릭", h("br", null),
                        "2. 마이크 → 허용 선택", h("br", null),
                        "3. 페이지 새로고침 후 다시 시도"
                    )
                ),
                h("button", {
                    onClick: requestMic,
                    className: "w-full py-4 rounded-2xl text-xl font-black text-white bg-orange-500 shadow-[0_5px_0_rgb(154,52,18)]"
                }, "🔄 다시 시도"),
                h("button", {
                    onClick: onDone,
                    className: "w-full py-3 rounded-2xl text-lg font-bold text-slate-400 bg-slate-50 border-2 border-slate-200"
                }, "마이크 없이 계속하기")
            )
        )
    );
}

    useEffect(function() {

            setStudents([
                { id: 1, name: '김민서' }, { id: 2, name: '이준혁' },

function FeelingPickScreen(props) {
    var sGroup = useState('red');       var group = sGroup[0], setGroup = sGroup[1];
    var sPicked = useState([]);         var picked = sPicked[0], setPicked = sPicked[1];
    var sDone = useState(false);        var done = sDone[0], setDone = sDone[1];

    var GROUPS = [
        { g: 'red',    label: '속상하거나\n화나는 마음', color: '#EF4444', glow: 'rgba(239,68,68,0.6)'   },
        { g: 'yellow', label: '평범하거나\n궁금한 마음', color: '#F59E0B', glow: 'rgba(245,158,11,0.6)'  },
        { g: 'green',  label: '기쁘고\n즐거운 마음',    color: '#10B981', glow: 'rgba(16,185,129,0.6)'  }
    ];

    var groupCards = FEELINGS_POOL.filter(function(f){ return f.group === group; });

    function togglePick(f) {
        var word = f.value || '';
        var idx = picked.indexOf(word);
        if (idx >= 0) {
            var n = picked.slice(); n.splice(idx, 1); setPicked(n);
        } else {
            setPicked(picked.concat([word]));
        }
    }

    if (done) {
        return h("div", { className: "w-full flex flex-col items-center justify-center gap-6 bg-[#F0F7FF]", style: { height:'100dvh' } },
            h(motion.div, { initial:{ scale:0 }, animate:{ scale:1 }, transition:{ type:'spring', stiffness:300, damping:20 } },
                h("div", { className: "text-9xl" }, "🎉")
            ),
            h("h2", { className: "text-4xl font-black text-purple-700" }, "감정 카드를 골랐어요!"),
            h("div", { className: "flex flex-wrap gap-3 justify-center max-w-2xl" },
                picked.map(function(word, i) {
                    var card = FEELINGS_POOL.find(function(f){ return f.value === word; }) || {};
                    return h("div", { key:i, className:"px-5 py-3 rounded-2xl bg-purple-100 border-2 border-purple-300 flex items-center gap-2" },
                        h("span", { className:"text-3xl" }, card.emoji || '💜'),
                        h("span", { className:"text-xl font-black text-purple-700" }, word)
                    );
                })
            ),
            h("div", { className:"flex gap-4" },
                h("button", { onClick: function(){ setDone(false); setPicked([]); }, className:"px-8 py-4 bg-slate-200 text-slate-700 rounded-2xl text-xl font-black" }, "← 다시 고르기"),
                h("button", { onClick: props.onBack, className:"px-10 py-4 bg-purple-500 text-white rounded-2xl text-xl font-black shadow-[0_6px_0_rgb(107,33,168)]" }, "✅ 완료!")
            )
        );
    }

    return h("div", { className: "w-full flex flex-col bg-[#F0F7FF] overflow-hidden", style: { height:'100dvh' } },
        h(StageHeader, {
            currentKey: 's2_feeling',
            onChangeStage: props.onChangeStage,
            onGoHome: props.onBack,
            rightSlot: h("div", { className:"flex items-center gap-2 px-5 py-2 bg-white border-2 border-purple-300 rounded-2xl shadow-sm" },
                h("span", { className:"text-2xl" }, "💜"),
                h("span", { className:"text-xl font-black text-purple-600" }, picked.length + "개 선택")
            )
        }),

        h("div", { className:"flex-1 flex flex-col p-4 gap-3 min-h-0 overflow-hidden" },
            // 말풍선
            h("div", { className:"flex items-start gap-3 shrink-0" },
                h(PencilFairy, { mini: true }),
                h("div", { className:"bg-white px-5 py-3 rounded-2xl shadow-md border-2 border-purple-200 mt-2 whitespace-nowrap" },
                    h("h2", { className:"text-2xl font-black text-slate-800" }, "내 마음의 색깔을 골라봐요!"),
                    h("p", { className:"text-xl text-slate-500 font-bold" }, "신호등 색깔을 누르고 감정을 선택해요")
                )
            ),

            // 좌(신호등) + 우(감정카드 그리드)
            h("div", { className:"flex-1 grid gap-4 min-h-0 overflow-hidden", style:{ gridTemplateColumns:'140px 1fr' } },

                // 신호등 세로 패널
                h("div", { className:"bg-slate-800 rounded-[2rem] flex flex-col items-center justify-center gap-5 py-6 px-3 shadow-2xl" },
                    GROUPS.map(function(item) {
                        var isActive = group === item.g;
                        var cnt = picked.filter(function(w){
                            var c = FEELINGS_POOL.find(function(f){ return f.value === w; });
                            return c && c.group === item.g;
                        }).length;
                        return h(motion.button, {
                            key: item.g,
                            whileHover:{ scale:1.06 }, whileTap:{ scale:0.95 },
                            onClick: (function(g){ return function(){ setGroup(g); }; })(item.g),
                            className:"flex flex-col items-center gap-2"
                        },
                            h(motion.div, {
                                animate: isActive ? { boxShadow:['0 0 20px '+item.glow,'0 0 45px '+item.glow,'0 0 20px '+item.glow] } : {},
                                transition:{ repeat:Infinity, duration:1.5 },
                                style:{
                                    width:'78px', height:'78px', borderRadius:'50%',
                                    background:'radial-gradient(circle at 35% 35%, '+item.color+'ff, '+item.color+'88)',
                                    boxShadow: isActive ? '0 0 25px '+item.glow+', inset -6px -6px 15px rgba(0,0,0,0.3)' : 'inset -6px -6px 15px rgba(0,0,0,0.4)',
                                    border: isActive ? '3px solid white' : '2px solid rgba(255,255,255,0.15)',
                                    opacity: isActive ? 1 : 0.65
                                }
                            }),
                            h("p", { style:{ color:item.color, fontWeight:900, fontSize:'0.8rem', textAlign:'center', whiteSpace:'pre-line', lineHeight:1.4 } }, item.label),
                            cnt > 0 && h("div", { style:{ background:item.color, color:'white', padding:'2px 10px', borderRadius:'999px', fontWeight:900, fontSize:'0.85rem' } }, cnt+"개")
                        );
                    })
                ),

                // 감정 카드 그리드
                h("div", { className:"bg-white rounded-[2rem] border-4 border-purple-100 p-4 flex flex-col gap-3 overflow-hidden min-h-0" },
                    h("h3", { className:"text-lg font-black text-purple-700 shrink-0" },
                        GROUPS.find(function(g){ return g.g === group; }) ?
                            GROUPS.find(function(g){ return g.g === group; }).label.replace('\n',' ') : ''
                    ),
                    h("div", { className:"flex-1 overflow-y-auto min-h-0" },
                        h("div", { className:"grid gap-3", style:{ gridTemplateColumns:'repeat(auto-fill, minmax(130px, 1fr))' } },
                            groupCards.map(function(f, i) {
                                var word = f.value || '';
                                var isChosen = picked.indexOf(word) >= 0;
                                return h(motion.button, {
                                    key: i,
                                    whileHover:{ scale:1.05, y:-3 }, whileTap:{ scale:0.95 },
                                    onClick: (function(fc){ return function(){ togglePick(fc); }; })(f),
                                    className:"flex flex-col items-center gap-2 p-4 rounded-2xl border-4 shadow-md " +
                                        (isChosen ? "bg-purple-100 border-purple-400 scale-105" : "bg-white border-slate-200 hover:border-purple-300")
                                },
                                    h("span", { className:"text-4xl" }, f.emoji || '💜'),
                                    h("span", { className:"text-lg font-black text-slate-800 text-center" }, word),
                                    h("span", { className:"text-sm font-bold text-slate-400 text-center leading-tight" }, f.desc || ''),
                                    isChosen && h("div", { className:"w-6 h-6 rounded-full bg-purple-500 flex items-center justify-center text-white text-xs font-black" }, "✓")
                                );
                            })
                        )
                    )
                )
            ),

            // 하단: 선택 표시 + 완료 버튼
            h("div", { className:"flex items-center gap-3 shrink-0" },
                h("div", { className:"flex-1 flex flex-wrap gap-2" },
                    picked.length > 0
                        ? picked.map(function(word, i) {
                            var card = FEELINGS_POOL.find(function(f){ return f.value === word; }) || {};
                            return h("div", { key:i, className:"flex items-center gap-1.5 px-3 py-1.5 rounded-2xl bg-purple-100 border-2 border-purple-300" },
                                h("span", { className:"text-lg" }, card.emoji || '💜'),
                                h("span", { className:"text-base font-black text-purple-700" }, word),
                                h("button", {
                                    onClick: (function(w){ return function(){ togglePick({ value:w }); }; })(word),
                                    className:"ml-1 text-sm text-purple-400 hover:text-purple-700"
                                }, "✕")
                            );
                        })
                        : h("span", { className:"text-base font-bold text-slate-400" }, "💡 마음에 드는 감정을 골라봐요!")
                ),
                h("button", {
                    onClick: function(){ if (picked.length > 0) setDone(true); },
                    disabled: picked.length === 0,
                    className:"px-10 py-4 rounded-2xl text-xl font-black shadow-md shrink-0 " +
                        (picked.length > 0 ? "bg-purple-500 text-white shadow-[0_6px_0_rgb(107,33,168)]" : "bg-slate-200 text-slate-400 cursor-not-allowed")
                }, picked.length > 0 ? "완료! (" + picked.length + "개) →" : "감정을 골라주세요")
            )
        )
    );
}

function App() {
    // screen: 'login' | 'menu' | 's1_1' | 's1_2' | 's2_1' | 's2_2' | 's3'
    var s1 = useState('login');
    var screen = s1[0], setScreen = s1[1];

    // 로그인된 학생
    var s2 = useState(null);
    var student = s2[0], setStudent = s2[1];

    // 진행 상태
    var s3 = useState(INIT_PROGRESS);
    var progress = s3[0], setProgress = s3[1];

    // 잠금 설정 버전 (LOCK_SETTINGS 변경 시 리렌더 트리거)
    var s4 = useState(0);
    var lockVer = s4[0], setLockVer = s4[1];

    function updateProgress(patch) {
        var next = Object.assign({}, progress, patch);
        setProgress(next);
        if (student) lsSet('diary_progress_' + student.id, next);
    }

    function doLogin(st) {
        setStudent(st);
        var saved = null;
        try {
            saved = lsGet('diary_progress_' + st.id, null);
            // 저장된 데이터가 INIT_PROGRESS 구조와 맞는지 검증
            if (saved && typeof saved !== 'object') saved = null;
        } catch(e) { saved = null; }
        var prog = saved
            ? Object.assign({}, INIT_PROGRESS, saved)
            : Object.assign({}, INIT_PROGRESS, { studentId: st.id, studentName: st.name });
        prog.studentName = st.name;
        prog.studentId = st.id;
        setProgress(prog);
        setScreen('menu');  // 바로 메뉴로

        var isGasOk = GAS_URL.indexOf('여기에') === -1 &&
                      GAS_URL.indexOf('script.google.com') !== -1;
        if (isGasOk) {
            // 잠금 설정 로드
            gasGet('getSettings')
                .then(function(d) {
                    if (d && d.settings) {
                        Object.assign(LOCK_SETTINGS, d.settings);
                        setLockVer(function(v) { return v + 1; });
                    }
                })
                .catch(function() {});

            // 카드 풀 로드 (언제/어디/누구/무엇 — DEMO_POOL 교체)
            gasGet('getCardPool')
                .then(function(d) {
                    if (d && d.cardPool && d.cardPool.length > 0) {
                        var newPool = { when: [], where: [], who: [], what: [] };
                        d.cardPool.forEach(function(card) {
                            var k = card.key;
                            if (newPool[k]) newPool[k].push({ value: card.value, emoji: card.emoji || '✨' });
                        });
                        ['when', 'where', 'who', 'what'].forEach(function(k) {
                            if (newPool[k].length > 0) DEMO_POOL[k] = newPool[k];
                        });
                    }
                })
                .catch(function() {});

            // 예시문장 테이블 로드 (4요소 — DEMO_EXAMPLES_TABLE 교체)
            gasGet('getExamplesTable')
                .then(function(d) {
                    if (d && d.examplesTable && Object.keys(d.examplesTable).length > 0) {
                        Object.keys(d.examplesTable).forEach(function(k) {
                            var rows = d.examplesTable[k];
                            if (!Array.isArray(rows)) return;
                            var normalized = rows.map(function(row) {
                                if (Array.isArray(row)) return row;
                                if (row && typeof row === 'object') {
                                    return [row.when || '', row.where || '', row.who || '', row.what || ''];
                                }
                                return null;
                            }).filter(function(r) {
                                return r && r.length >= 4 && r[0] && r[1] && r[2] && r[3];
                            });
                            if (normalized.length > 0) DEMO_EXAMPLES_TABLE[k] = normalized;
                        });
                    }
                })
                .catch(function() {});

            // 감정 풀 로드 (FEELINGS_POOL 교체)
            gasGet('getFeelingsPool')
                .then(function(d) {
                    if (d && d.feelingsPool && d.feelingsPool.length > 0) {
                        FEELINGS_POOL.length = 0;
                        d.feelingsPool.forEach(function(f) {
                            FEELINGS_POOL.push({
                                value: f.value,
                                emoji: f.emoji || '💜',
                                group: f.group || 'yellow',
                                desc:  f.desc  || ''
                            });
                        });
                    }
                })
                .catch(function() {});

            // 감정 예시문장 로드 (FEELINGS_EXAMPLES 교체)
            gasGet('getFeelingsTable')
                .then(function(d) {
                    if (d && d.feelingsTable && Object.keys(d.feelingsTable).length > 0) {
                        Object.keys(d.feelingsTable).forEach(function(k) {
                            var rows = d.feelingsTable[k];
                            if (!Array.isArray(rows) || rows.length === 0) return;
                            var normalized = rows.map(function(row) {
                                if (Array.isArray(row)) return row;
                                if (row && typeof row === 'object') {
                                    return [row.when || '', row.where || '', row.who || '', row.what || '', row.feeling || ''];
                                }
                                return null;
                            }).filter(function(r) {
                                return r && r.length >= 4 && r[0];
                            });
                            if (normalized.length > 0) FEELINGS_EXAMPLES[k] = normalized;
                        });
                    }
                })
                .catch(function() {});

            // 추천 감정 매핑 로드
            gasGet('getRecommendedFeelings')
                .then(function(d) {
                    if (d && d.recommendedFeelings && Object.keys(d.recommendedFeelings).length > 0) {
                        // 시트 데이터로 완전 교체 (카테고리 컬럼 등 불필요한 값 정리)
                        var sheetData = d.recommendedFeelings;
                        var cleaned = {};
                        Object.keys(sheetData).forEach(function(k) {
                            var key = String(k).trim();
                            // 빈 키, 헤더, 카테고리 이모지 행 스킵
                            if (!key || key.length === 0) return;
                            if (key.indexOf('카테고리') !== -1 || key.indexOf('서술어') !== -1) return;
                            var vals = sheetData[k];
                            if (Array.isArray(vals) && vals.length > 0) cleaned[key] = vals;
                        });
                        if (Object.keys(cleaned).length > 0) {
                            // 기존 하드코딩 완전 교체
                            Object.keys(RECOMMENDED_FEELINGS).forEach(function(k) { delete RECOMMENDED_FEELINGS[k]; });
                            Object.keys(cleaned).forEach(function(k) { RECOMMENDED_FEELINGS[k] = cleaned[k]; });
                            console.log('[추천감정] 시트에서 ' + Object.keys(cleaned).length + '개 로드 완료');
                        }
                    }
                })
                .catch(function(e) {
                    console.log('[추천감정] 로드 실패, 기본값 사용:', e);
                });
        }
    }

    function goTo(sc) { setScreen(sc); }
    function goMenu() { setScreen('menu'); }
    function goLogin() {
        setStudent(null);
        setProgress(INIT_PROGRESS);
        setScreen('login');
    }

    var content = null;

    if (screen === 'login') {
        content = h(LoginScreen, { onLogin: doLogin });

    } else if (screen === 'mic_permission') {
        content = h(MicPermissionScreen, {
            studentName: student ? student.name : '',
            onDone: goMenu
        });

    } else if (screen === 'menu') {
        content = h(MainMenu, {
            progress: progress,
            lockVer: lockVer,
            onNavigate: function(stageNum, sub) {
                // 화면 키 결정
                var sc;
                if      (stageNum === '1') sc = 's1_1';
                else if (stageNum === '2') sc = 's1_2';
                else if (stageNum === '3') sc = 's3';
                if (sc) goTo(sc);
            },
            onChangeStudent: goLogin
        });

    } else if (screen === 's1_1') {
        content = h(Stage1_1, {
            onBack: goMenu,
            onChangeStage: function(key) { goTo(key); },
            collectedCards: progress.cards1List || [],
            onComplete: function(newCards) {
                // 카드 누적 병합 (key + value 같으면 중복 제거)
                var existing = progress.cards1List || [];
                var incoming = Array.isArray(newCards) ? newCards : [];

                // 새로 추가된 카드만 추출
                var addedCards = [];
                incoming.forEach(function(nc) {
                    var dup = false;
                    for (var i = 0; i < existing.length; i++) {
                        if (existing[i].key === nc.key && existing[i].value === nc.value) { dup = true; break; }
                    }
                    if (!dup) addedCards.push(nc);
                });

                // GAS에 새 카드만 전송
                if (addedCards.length > 0) {
                    try {
                        gasPost({
                            type: 'saveCard',
                            studentId: student ? student.id : '',
                            studentName: student ? student.name : '',
                            stage: '1단계❶',
                            cards: addedCards
                        }).catch(function(){});
                    } catch(e) {}
                }

                // 병합된 전체 목록 저장
                var merged = existing.concat(addedCards);
                updateProgress({
                    cards1: merged.length,
                    cards1List: merged
                });
                goMenu();
            }
        });

    } else if (screen === 's1_2') {
        content = h(Stage1_2, {
            onBack: goMenu,
            onChangeStage: function(key) { goTo(key); },
            onComplete: function(sentence) {
                // 문장 완성 기록 → 학습문장 시트
                try {
                    gasPost({
                        type: 'saveSentence',
                        studentId: student ? student.id : '',
                        studentName: student ? student.name : '',
                        stage: '1단계❷',
                        sentence1: sentence
                    }).catch(function(){});
                } catch(e) {}
                updateProgress({ did1_2: true, sentence1: sentence });
                goMenu();
            },
            cards1: progress.cards1,
            collectedCards: progress.cards1List || [],
            previousSentence: progress.sentence1
        });

    } else if (screen === 's3') {
        content = h(Stage3, {
            onBack: goMenu,
            onChangeStage: function(key) { goTo(key); },
            progress: progress,
            gasPost: gasPost,
            collectedCards1: progress.cards1List || [],
            collectedCards2: progress.cards2List || []
        });
    }

    return h('div', { className: 'w-full overflow-hidden bg-[#F0F7FF]', style: { height: '100dvh' } }, content);
}

// 에러 경계 — 앱 크래시 시 안내 화면 표시
class ErrorBoundary extends React.Component {
    constructor(props) { super(props); this.state = { hasError: false, error: null }; }
    static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
    render() {
        if (this.state.hasError) {
            return React.createElement('div', {
                style: { height:'100dvh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'1rem', padding:'2rem', background:'#fff7ed' }
            },
                React.createElement('div', { style: { fontSize:'4rem' } }, '⚠️'),
                React.createElement('h2', { style: { fontSize:'1.5rem', fontWeight:900, color:'#c2410c' } }, '앱을 불러오는 중 오류가 발생했어요'),
                React.createElement('p', { style: { fontSize:'1rem', color:'#64748b', maxWidth:'400px', textAlign:'center' } },
                    String(this.state.error)
                ),
                React.createElement('button', {
                    onClick: function() {
                        try { localStorage.clear(); } catch(e) {}
                        location.reload();
                    },
                    style: { padding:'0.75rem 2rem', background:'#f97316', color:'white', borderRadius:'1rem', fontWeight:900, fontSize:'1.1rem', border:'none', cursor:'pointer' }
                }, '🔄 새로고침')
            );
        }
        return this.props.children;
    }
}

ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(ErrorBoundary, null, React.createElement(App))
);
</script>
</body>
</html>
