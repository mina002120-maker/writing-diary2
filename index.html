var _MotionLib = window.Motion || window.FramerMotion || {};
var motion = _MotionLib.motion;

// framer-motion 로드 실패 시 기본 div로 대체
if (!motion) {
    var _tags = ['div','span','button','a','p','h1','h2','h3','ul','li','section','article'];

    for (var _ti = 0; _ti < _tags.length; _ti++) {
        (function(tag) {

                // animate/initial/transition/whileHover/whileTap 제거 후 렌더
                var safeProps = {};
                if (props) {

                            safeProps[k] = props[k];

    try { var v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }

}
function lsSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}

// ── GAS 통신 ──
function gasGet(type, params) {
    var url = GAS_URL + '?type=' + type;
    if (params) {
        Object.keys(params).forEach(function(k) {
            url += '&' + k + '=' + encodeURIComponent(params[k]);
        });
    }
    return fetch(url).then(function(r) { return r.json(); });
}
function gasPost(data) {
    return fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
    });
}

var DEMO_STATES = {

function StageCard(props) {
    var stage = props.stage;
    var progress = props.progress;
    var onClick = props.onClick;
    var onClickSub1 = props.onClickSub1 || onClick;
    var onClickSub2 = props.onClickSub2 || onClick;
    var stageLocked = progress.stageLocked;
    var titleColor = stage.accentText;

    return h(motion.div, {
        whileHover: stageLocked ? {} : { scale: 1.02, y: -4 },
        whileTap: stageLocked ? {} : { scale: 0.98 },
        transition: { type: "spring", stiffness: 280, damping: 20 },
        style: { background: 'linear-gradient(180deg, ' + stage.bgGradFrom + ' 0%, ' + stage.bgGradTo + ' 100%)' },
        className: "relative rounded-[2.5rem] overflow-hidden flex flex-col h-full " + stage.shadowClass +
            (stageLocked ? " grayscale opacity-70" : "")
    },
        // 배경 장식 스티커
        h("div", { className: "absolute inset-0 pointer-events-none overflow-hidden" },
            h("div", { className: "absolute top-4 right-6 text-2xl opacity-30 sparkle" }, "✨"),
            h("div", { className: "absolute top-32 left-4 text-xl opacity-25" }, "⭐"),
            h("div", { className: "absolute bottom-32 right-4 text-xl opacity-25" }, "✨"),
            h("div", { className: "absolute bottom-12 left-6 text-2xl opacity-30 sparkle" }, "⭐")
        ),

        // 큰 단계 번호 라벨 (왼쪽 상단)
        h("div", {
            className: "absolute top-4 left-4 px-4 h-12 rounded-full flex items-center justify-center font-black text-lg text-white border-4 border-white shadow-lg z-10",
            style: { background: stage.accentBg }
        }, stage.number + "단계"),

        // 메인 캐릭터
        h("div", { className: "pt-8 pb-2 flex justify-center" },
            h(motion.div, {
                animate: stageLocked ? {} : { y: [0, -8, 0] },
                transition: { repeat: Infinity, duration: 2.5, ease: "easeInOut" },
                className: "relative"
            },
                h("div", {
                    className: "w-28 h-28 rounded-full flex items-center justify-center text-7xl border-[6px] border-white shadow-xl",
                    style: { background: stage.innerBg }
                }, stage.char),
                h("span", { className: "absolute -top-1 -right-1 text-2xl" }, stage.sticker1),
                h("span", { className: "absolute -bottom-1 -left-2 text-2xl" }, stage.sticker3)
            )
        ),

        // 제목
        h("div", { className: "px-5 text-center pb-3" },

            h("p", { className: "text-base font-bold", style: { color: titleColor, opacity: 0.7 } }, stage.subtitle)
        ),

        h("div", { className: "px-2 md:px-3 pb-2 md:pb-3 flex flex-col gap-1.5" },
            // 하위 1 — 클릭 가능한 버튼
            h("button", {
                onClick: function(e) { e.stopPropagation(); if (!stageLocked) onClickSub1(); },
                disabled: stageLocked,
                className: "w-full text-left bg-white/80 backdrop-blur rounded-xl px-3 py-2 border-2 transition " +

            },
                h("div", { className: "flex items-center gap-3" },
                    h("div", {
                        className: "w-7 h-7 rounded-full flex items-center justify-center text-xs font-black border-2 shrink-0 " +

                    }, progress.sub1Done ? "✓" : "1"),
                    h("p", { className: "text-xs md:text-sm font-black flex-1", style: { color: titleColor } }, stage.sub1),
                    progress.sub1Count > 0 && h("span", { className: "text-sm font-black", style: { color: titleColor } },
                        progress.sub1Count + (progress.sub1Total > 1 ? "/" + progress.sub1Total : "")
                    ),
                    !stageLocked && h("span", { className: "text-slate-400 text-sm" }, "→")
                ),
                // 진행바
                progress.sub1Total > 1 && h("div", { className: "mt-2 w-full h-2 rounded-full bg-slate-100 overflow-hidden" },
                    h(motion.div, {
                        initial: { width: 0 },
                        animate: { width: Math.min(100, (progress.sub1Count / progress.sub1Total) * 100) + '%' },
                        transition: { duration: 0.6, ease: "easeOut" },
                        className: "h-full rounded-full",
                        style: { background: stage.accentBg }
                    })
                )
            ),
            // 하위 2 — 클릭 가능한 버튼
            h("button", {
                onClick: function(e) { e.stopPropagation(); if (!stageLocked && !progress.sub2Locked) onClickSub2(); },

                className: "w-full text-left bg-white/80 backdrop-blur rounded-xl px-3 py-2 border-2 transition " +

                    }, progress.sub2Done ? "✓" : progress.sub2Locked ? "🔒" : "2"),
                    h("div", { className: "flex-1" },
                        h("p", { className: "text-base font-black " + (progress.sub2Locked ? "text-slate-400" : ""), style: progress.sub2Locked ? {} : { color: titleColor } }, stage.sub2),
                        progress.sub2Locked && h("p", { className: "text-xs text-slate-400 font-bold mt-0.5" }, progress.sub2LockReason)
                    ),
                    progress.sub2Done
                        ? h("span", { className: "text-xl" }, "⭐")
                        : !progress.sub2Locked && !stageLocked && h("span", { className: "text-slate-400 text-sm" }, "→")
                ),
                // 진행바
                !progress.sub2Locked && h("div", { className: "mt-2 w-full h-2 rounded-full bg-slate-100 overflow-hidden" },
                    h(motion.div, {
                        initial: { width: 0 },
                        animate: { width: (progress.sub2Done ? 100 : 0) + '%' },
                        transition: { duration: 0.6, ease: "easeOut" },
                        className: "h-full rounded-full",
                        style: { background: stage.accentBg }
                    })
                )
            )
        ),

        // 단계 전체 잠금 오버레이
        stageLocked && h("div", { className: "absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-5 z-20" },

// ═══════════════════════════════════════════════
// 공용 튜토리얼 팝업 (처음 접속 시만 표시)
// ═══════════════════════════════════════════════
function Tutorial(props) {
    var steps = props.steps || [];
    var storageKey = props.storageKey || 'tutorial_done';
    var accentColor = props.accentColor || 'orange';
    var seen = false;
    try { seen = !!localStorage.getItem(storageKey); } catch(e) {}
    var sOpen = useState(!seen);
    var open = sOpen[0], setOpen = sOpen[1];
    var sStep = useState(0);
    var step = sStep[0], setStep = sStep[1];
    function close() {
        try { localStorage.setItem(storageKey, '1'); } catch(e) {}
        setOpen(false);
    }
    function next() { if (step + 1 < steps.length) setStep(step + 1); else close(); }
    function prev() { if (step > 0) setStep(step - 1); }
    if (!open || steps.length === 0) return null;
    var cur = steps[step];
    var isLast = step === steps.length - 1;
    var colMap = {
        orange:  { bg: 'bg-orange-500',  light: 'bg-orange-50',  border: 'border-orange-300',  btn: 'bg-orange-500 shadow-[0_5px_0_rgb(154,52,18)]' },
        purple:  { bg: 'bg-purple-500',  light: 'bg-purple-50',  border: 'border-purple-300',  btn: 'bg-purple-500 shadow-[0_5px_0_rgb(107,33,168)]' },
        emerald: { bg: 'bg-emerald-500', light: 'bg-emerald-50', border: 'border-emerald-300', btn: 'bg-emerald-500 shadow-[0_5px_0_rgb(4,120,87)]'  }
    };
    var col = colMap[accentColor] || colMap.orange;
    return h(motion.div, {
        initial: { opacity: 0 }, animate: { opacity: 1 },
        className: "fixed inset-0 z-50 flex items-center justify-center",
        style: { background: 'rgba(0,0,0,0.5)' }
    },
        h(motion.div, {
            initial: { scale: 0.8, y: 30 }, animate: { scale: 1, y: 0 },
            transition: { type: 'spring', stiffness: 280, damping: 22 },
            className: "mx-3 w-full max-w-2xl bg-white rounded-[2rem] shadow-2xl border-4 " + col.border + " overflow-hidden"
        },

// 공용 컴포넌트 — 폭죽 (정답 시 표시)
// ═══════════════════════════════════════════════
function Confetti(props) {
    var show = props.show;
    if (!show) return null;

    // 폭죽 조각 30개 — 색·크기·각도 랜덤
    var colors = ['#F87171', '#FB923C', '#FBBF24', '#FACC15', '#34D399', '#22D3EE', '#60A5FA', '#A78BFA', '#F472B6'];
    var pieces = [];
    for (var i = 0; i < 30; i++) {
        var angle = (Math.PI * 2 * i) / 30 + (Math.random() - 0.5) * 0.4;
        var distance = 280 + Math.random() * 200;
        pieces.push({
            id: i,
            color: colors[i % colors.length],
            dx: Math.cos(angle) * distance,
            dy: Math.sin(angle) * distance - 100, // 살짝 위로
            rot: Math.random() * 720,
            size: 10 + Math.random() * 8,
            delay: Math.random() * 0.15
        });
    }

    return h("div", {
        className: "fixed inset-0 pointer-events-none flex items-center justify-center",
        style: { zIndex: 9999 }
    },
        // 중앙 큰 이모지
        h(motion.div, {
            initial: { scale: 0, rotate: -180 },
            animate: { scale: [0, 1.3, 1], rotate: 0 },
            transition: { duration: 0.6, times: [0, 0.5, 1] },
            className: "text-9xl",
            style: { filter: 'drop-shadow(0 0 30px rgba(251, 191, 36, 0.6))' }
        }, "🎉"),
        // 폭죽 조각들
        pieces.map(function(p) {
            return h(motion.div, {
                key: p.id,
                initial: { x: 0, y: 0, opacity: 1, rotate: 0, scale: 1 },
                animate: { x: p.dx, y: p.dy + 400, opacity: 0, rotate: p.rot, scale: 0.5 },
                transition: { duration: 1.5, delay: p.delay, ease: [0.2, 0.8, 0.4, 1] },
                className: "absolute rounded-sm",
                style: {
                    width: p.size + 'px',
                    height: p.size + 'px',
                    background: p.color,
                    boxShadow: '0 0 12px ' + p.color
                }
            });
        })
    );
}

// 한 문장을 4영역으로 받아서, 글자별로 색을 매칭해 10칸 공책에 그리기
function buildCellGrid(parts) {
    // parts = [언제, 어디서, 누구와, 무엇을]
    // 결과: [{ ch: '오', color: 'when' }, ...]
    var keys = ['when', 'where', 'who', 'what'];
    var cells = [];
    for (var i = 0; i < parts.length; i++) {
        var word = parts[i];
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') {
                cells.push({ ch: '', color: null, isSpace: true });
            } else {
                cells.push({ ch: ch, color: keys[i] });
            }
        }
        // 어절 사이 공백 (마지막 어절 뒤에는 없음)
        if (i < parts.length - 1) {
            cells.push({ ch: '', color: null, isSpace: true });
        }
    }
    return cells;
}

// 공책 칸 그리기 (cells = 글자 배열, 칸당 10개씩 줄바꿈)
// 줄 수에 따라 칸 크기를 자동 조절: 1~2줄=큼, 3줄=중간, 4줄+=작음
function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;
    var rows = [];
    for (var i = 0; i < cells.length; i += perRow) {
        rows.push(cells.slice(i, i + perRow));
    }
    // 마지막 줄이 10칸 미만이면 빈 칸으로 채워서 시각적 정렬
    while (rows[rows.length - 1].length < perRow) {
        rows[rows.length - 1].push({ ch: '', color: null, isEmpty: true });
    }

    // 줄 수에 따라 셀 크기 결정 (가독성과 화면 맞춤의 균형)
    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) {
        cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3';
    } else if (lineCount === 3) {
        cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2';
    } else {
        // 4줄 이상
        cellSize = 'w-14 h-14'; textSize = 'text-2xl'; gap = 'gap-2';
    }

    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {
                    var bgClass = 'bg-white';
                    var textClass = 'text-slate-700';
                    var borderClass = 'border-slate-300';
                    if (cell.color) {
                        var c = FIELD_COLORS[cell.color];
                        bgClass = c.bg;
                        textClass = c.text;
                        borderClass = c.border;
                    }
                    if (cell.isSpace) {
                        // 빈 칸(띄어쓰기): 옅은 회색
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-200 border-dashed';
                    }
                    if (cell.isEmpty) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-100';
                    }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass
                    }, cell.ch);
                })
            );
        })
    );
}

// ───── 음성 비교 헬퍼 ─────
// 비교용 정규화: 공백 제거, 조사 일부 제거 (1-2학년 발음 차이 흡수)
function normalize(s) {
    if (!s) return '';
    var t = String(s).toLowerCase();
    // 모든 공백/특수문자 제거
    t = t.replace(/[\s.,!?~'"`\-_]+/g, '');
    return t;
}

// 한 요소(예: '학교에서')가 음성에 포함되는지 검사
// 어절 핵심부 추출 후 매칭 (조사 변동 흡수)
function fieldMatched(transcript, target) {
    var nT = normalize(transcript);
    var nTarget = normalize(target);
    if (!nT || !nTarget) return false;

    // 1) 직접 포함되면 OK
    if (nT.indexOf(nTarget) !== -1) return true;

    // 2) 어간 추출 비교: 대상에서 흔한 어미/조사 제거 후 비교
    //    "학교에서" → "학교", "친구랑" → "친구", "반갑게 인사했다" → "반갑게인사"
    var trimmed = nTarget
        .replace(/(에서|에게|이랑|랑|이|가|을|를|은|는|와|과|께|에)$/g, '')
        .replace(/(했다|했어요|했어|했지|한다)$/g, '하')
        .replace(/(었다|었어요|었어|었지)$/g, '');
    if (trimmed.length >= 2 && nT.indexOf(trimmed) !== -1) return true;

    // 3) 글자 단위 부분 일치: 대상의 70% 이상 문자가 순서대로 나타나면 OK
    //    (음성 인식 오류 흡수용)
    if (nTarget.length >= 2) {
        var matched = 0, idx = 0;
        for (var i = 0; i < nTarget.length; i++) {
            var pos = nT.indexOf(nTarget.charAt(i), idx);
            if (pos !== -1) { matched++; idx = pos + 1; }
        }
        if (matched / nTarget.length >= 0.7) return true;
    }
    return false;
}

// 예시문장 4요소가 각각 음성에 들어갔는지 검사
// ═══════════════════════════════════════════════
// 한국어 TTS (자연스러운 Google/Neural 음성 우선)
// ═══════════════════════════════════════════════
var _ttsCache = { voice: null, ready: false };

function _selectKoreanVoice() {
    if (!window.speechSynthesis) return null;
    var voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return null;

    // 1순위: Google 한국어 (클라우드 음성, 가장 자연스러움)
    var v1 = voices.find(function(v) {
        return v.lang === 'ko-KR' &&
               v.name.toLowerCase().indexOf('google') !== -1 &&
               !v.localService;
    });
    if (v1) return v1;

    // 2순위: Wavenet/Neural2 (Google Cloud)
    var v2 = voices.find(function(v) {
        return v.lang === 'ko-KR' &&
               (v.name.indexOf('Wavenet') !== -1 || v.name.indexOf('Neural') !== -1);
    });
    if (v2) return v2;

    // 3순위: 자연스러움 키워드
    var v3 = voices.find(function(v) {
        return v.lang === 'ko-KR' &&
               /wavenet|neural|premium|enhanced|natural/i.test(v.name);
    });
    if (v3) return v3;

    // 4순위: 그냥 ko-KR
    var v4 = voices.find(function(v) { return v.lang === 'ko-KR'; });
    if (v4) return v4;

    // 5순위: 한국어 비슷한 것
    return voices.find(function(v) { return v.lang && v.lang.indexOf('ko') === 0; }) || null;
}

// 음성 목록 로드 (브라우저마다 비동기로 로드됨)
if (window.speechSynthesis) {
    var loadVoices = function() {
        _ttsCache.voice = _selectKoreanVoice();
        _ttsCache.ready = true;
    };
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
}

// 음성 재생
function speakKorean(text, opts) {
    if (!text || !window.speechSynthesis) return;
    opts = opts || {};
    // 진행 중인 발화 중지
    window.speechSynthesis.cancel();

    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.pitch = opts.pitch != null ? opts.pitch : 1.0;  // 기본 1.0
    utter.rate = opts.rate != null ? opts.rate : 0.95;    // 약간 천천히, 자연스럽게
    utter.volume = opts.volume != null ? opts.volume : 1.0;

    var voice = _ttsCache.voice || _selectKoreanVoice();
    if (voice) utter.voice = voice;

    if (opts.onstart) utter.onstart = opts.onstart;
    if (opts.onend) utter.onend = opts.onend;

    window.speechSynthesis.speak(utter);
    return utter;
}

function ListenButton(props) {
    var text = props.text || '';

    var color = props.color || 'blue';

            onend: function() { setSpeaking(false); }

    var colorClass = {
        blue:   'bg-blue-500 hover:bg-blue-600 shadow-[0_4px_0_rgb(29,78,216)]',
        purple: 'bg-purple-500 hover:bg-purple-600 shadow-[0_4px_0_rgb(107,33,168)]',

    }[color] || 'bg-blue-500 shadow-[0_4px_0_rgb(29,78,216)]';

    return h("button", {
        onClick: handleClick,
        className: "px-5 py-3 rounded-2xl text-white text-lg font-black active:translate-y-1 active:shadow-none " + colorClass
    }, speaking ? "⏸️ 그만 듣기" : label);

// 한 문장을 4영역으로 받아서, 글자별로 색을 매칭해 10칸 공책에 그리기
function buildCellGrid(parts) {
    var keys = FIELD_KEYS;
    var cells = [];
    for (var i = 0; i < parts.length; i++) {
        var word = parts[keys[i]];
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') {
                cells.push({ ch: '', color: null, isSpace: true });
            } else {
                cells.push({ ch: ch, color: keys[i] });
            }
        }
        if (i < parts.length - 1) {
            cells.push({ ch: '', color: null, isSpace: true });
        }
    }
    return cells;
}

// 공책 칸 그리기 (cells = 글자 배열, 칸당 10개씩 줄바꿈)
function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;
    var rows = [];
    for (var i = 0; i < cells.length; i += perRow) {
        rows.push(cells.slice(i, i + perRow));
    }
    while (rows[rows.length - 1].length < perRow) {
        rows[rows.length - 1].push({ ch: '', color: null, isEmpty: true });
    }

    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) {
        cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3';
    } else if (lineCount === 3) {
        cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2';
    } else {
        cellSize = 'w-14 h-14'; textSize = 'text-2xl'; gap = 'gap-2';
    }

    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {
                    var bgClass = 'bg-white';
                    var textClass = 'text-slate-700';
                    var borderClass = 'border-slate-300';
                    if (cell.color) {
                        var c = FIELD_COLORS[cell.color];
                        bgClass = c.bg;
                        textClass = c.text;
                        borderClass = c.border;
                    }
                    if (cell.isSpace) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-200 border-dashed';
                    }
                    if (cell.isEmpty) {
                        bgClass = 'bg-slate-50';
                        borderClass = 'border-slate-100';
                    }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass
                    }, cell.ch);
                })
            );
        })
    );
}

// ────── 음성 비교 헬퍼 (1단계와 동일) ──────
function normalize(s) {
    if (!s) return '';
    var t = String(s).toLowerCase();
    t = t.replace(/[\s.,!?~'"`\-_]+/g, '');
    return t;
}
function fieldMatched(transcript, target) {
    var nT = normalize(transcript);
    var nTarget = normalize(target);
    if (!nT || !nTarget) return false;
    if (nT.indexOf(nTarget) !== -1) return true;
    var trimmed = nTarget
        .replace(/(에서|에게|이랑|랑|이|가|을|를|은|는|와|과|께|에)$/g, '')
        .replace(/(했다|했어요|했어|했지|한다)$/g, '하')
        .replace(/(었다|었어요|었어|었지)$/g, '');
    if (trimmed.length >= 2 && nT.indexOf(trimmed) !== -1) return true;
    if (nTarget.length >= 2) {
        var matched = 0, idx = 0;
        for (var i = 0; i < nTarget.length; i++) {
            var pos = nT.indexOf(nTarget.charAt(i), idx);
            if (pos !== -1) { matched++; idx = pos + 1; }
        }
        if (matched / nTarget.length >= 0.7) return true;
    }
    return false;
}
function checkAllFields(transcript, parts) {
    var keys = FIELD_KEYS;
    var result = {};
    for (var i = 0; i < keys.length; i++) {
        result[keys[i]] = fieldMatched(transcript, parts[i]);
    }
    return result;
}

// 공책 칸 셀
function buildCellGrid(parts) {
    var keys = FIELD_KEYS;
    var cells = [];
    for (var i = 0; i < parts.length; i++) {
        var word = parts[i];
        for (var j = 0; j < word.length; j++) {
            var ch = word.charAt(j);
            if (ch === ' ') cells.push({ ch: '', color: null, isSpace: true });
            else cells.push({ ch: ch, color: keys[i] });
        }
        if (i < parts.length - 1) cells.push({ ch: '', color: null, isSpace: true });
    }
    return cells;
}

function NotebookGrid(props) {
    var cells = props.cells;
    var perRow = 10;
    var rows = [];
    for (var i = 0; i < cells.length; i += perRow) rows.push(cells.slice(i, i + perRow));
    while (rows[rows.length - 1].length < perRow) rows[rows.length - 1].push({ ch:'', color:null, isEmpty:true });
    var lineCount = rows.length;
    var cellSize, textSize, gap;
    if (lineCount <= 2) { cellSize = 'w-20 h-20'; textSize = 'text-4xl'; gap = 'gap-3'; }
    else if (lineCount === 3) { cellSize = 'w-16 h-16'; textSize = 'text-3xl'; gap = 'gap-2'; }
    else { cellSize = 'w-14 h-14'; textSize = 'text-2xl'; gap = 'gap-2'; }
    return h("div", { className: "flex flex-col " + gap },
        rows.map(function (row, ri) {
            return h("div", { key: ri, className: "flex " + gap },
                row.map(function (cell, ci) {

                    if (cell.color) { var c = FIELD_COLORS[cell.color]; bgClass = c.bg; textClass = c.text; borderClass = c.border; }
                    if (cell.isSpace) { bgClass = 'bg-slate-50'; borderClass = 'border-slate-200 border-dashed'; }
                    if (cell.isEmpty) { bgClass = 'bg-slate-50'; borderClass = 'border-slate-100'; }
                    return h("div", {
                        key: ci,
                        className: cellSize + " border-4 rounded-xl flex items-center justify-center font-black shadow-sm " + textSize + " " + bgClass + " " + textClass + " " + borderClass

                })
            );
        })
    );
}

    // ───── study ─────
    else if (subStep === 'study') {

                    ),

            ),
            h("div", { className: "flex justify-center gap-2" },

    // ───── record (음성 + 피드백) ─────
    else if (subStep === 'record') {
        var matchResult = (transcript && currentExample) ? checkAllFields(transcript, currentExample) : null;
        var matchCount = matchResult
            ? ((matchResult.when?1:0)+(matchResult.where?1:0)+(matchResult.who?1:0)+(matchResult.what?1:0)+(matchResult.feeling?1:0))
            : 0;
        var feedback = null;
        if (transcript && !recording) {
            if (!currentExample) {
                feedback = { emoji:"👏", text:"잘 말했어요! 다음으로 넘어가봐요!", bg:"bg-emerald-50", border:"border-emerald-400", textColor:"text-emerald-700" };
            } else if (matchCount === 5) feedback = { emoji:"🎉", text:"와! 완벽해요! 정말 잘 말했어요!", bg:"bg-emerald-50", border:"border-emerald-400", textColor:"text-emerald-700" };
            else if (matchCount === 4) feedback = { emoji:"👍", text:"거의 다 맞았어요! 한 부분만 더!", bg:"bg-amber-50", border:"border-amber-400", textColor:"text-amber-700" };
            else if (matchCount === 3) feedback = { emoji:"💪", text:"좋아요! 조금만 더 말해볼까요?", bg:"bg-orange-50", border:"border-orange-400", textColor:"text-orange-700" };
            else if (matchCount === 2) feedback = { emoji:"🌱", text:"괜찮아요! 두 부분 더 말해볼까요?", bg:"bg-blue-50", border:"border-blue-400", textColor:"text-blue-700" };
            else feedback = { emoji:"🌱", text:"괜찮아요! 천천히 다시 한번 말해볼까요?", bg:"bg-blue-50", border:"border-blue-400", textColor:"text-blue-700" };
        }

        var coloredWithCheck = h("div", { className: "flex flex-wrap items-end gap-2 justify-center" },
            S2_FIELD_KEYS.map(function (k, i) {
                var c = S2_FIELD_COLORS[k];
                var isMatched = matchResult ? matchResult[k] : null;
                return h("div", { key: i, className: "flex flex-col items-center gap-1 relative" },
                    h("span", { className: "text-xs font-black " + c.text }, c.name),
                    h("div", { className: "relative" },
                        h("span", {
                            className: "block px-4 py-2.5 rounded-2xl text-2xl font-black shadow-md border-4 " + c.bg + " " + c.text + " " + c.border
                        }, currentExample[i]),
                        matchResult && (isMatched
                            ? h(motion.div, {
                                initial: { scale: 0, rotate: -30 },
                                animate: { scale: 1, rotate: 0 },
                                className: "absolute -top-2.5 -right-2.5 w-8 h-8 bg-emerald-500 text-white rounded-full border-4 border-white shadow-lg flex items-center justify-center text-base font-black"
                            }, "✓")
                            : h(motion.div, {
                                initial: { scale: 0 },
                                animate: { scale: 1 },
                                className: "absolute -top-2.5 -right-2.5 w-8 h-8 bg-slate-400 text-white rounded-full border-4 border-white shadow-lg flex items-center justify-center text-base font-black"
                            }, "?")
                        )
                    )
                );
            })
        );

        // 자세한 피드백 (2단계는 5요소)
        var detailedFeedback = null;
        if (transcript && !recording && currentExample && matchResult && matchCount < 5) {
            var labels5 = { when: '언제', where: '어디서', who: '누구와', what: '무엇을', feeling: '감정' };
            var idxMap5 = { when:0, where:1, who:2, what:3, feeling:4 };
            var missing = [];
            S2_FIELD_KEYS.forEach(function(k) {
                if (!matchResult[k]) missing.push(labels5[k] + '(' + (currentExample[idxMap5[k]] || '') + ')');
            });
            if (missing.length > 0) {
                detailedFeedback = missing.join(', ') + ' 을(를) 다시 말해봐요!';
            }
        }

        content = h("div", { className: "flex-1 flex flex-col p-3 md:p-4 gap-2 min-h-0 overflow-hidden" },
            h("div", { className: "flex items-start gap-3 shrink-0" },
                h(PencilFairy, { mini: true, isListening: recording }),
                h("div", { className: "flex-1 bg-white px-7 py-3 rounded-3xl shadow-xl border-2 mt-4 " + (recording ? "border-red-400 ring-4 ring-red-50" : "border-purple-200") },
                    h("h2", { className: "text-2xl font-black " + (recording ? "text-red-500" : "text-slate-800") },
                        recording ? "🎙️ 듣고 있어요!" : (mustRetry ? "음... 다시 또박또박 말해볼까요? 🌱" : "큰 소리로 따라 말해봐요! (예시 " + (exampleIdx + 1) + "/" + examples.length + ")")
                    )
                ),
                currentExample && h(ListenButton, {
                    text: currentExample.join(' '),
                    label: "🔊 듣기",

                })
            ),
            h("div", { className: "bg-white p-3 rounded-2xl shadow-md border-2 border-purple-100" },
                coloredWithCheck
            ),
            h("div", { className: "flex-1 flex flex-col items-center justify-center gap-2 min-h-0 overflow-hidden" },
                h("div", { className: "w-full max-w-4xl" },

                    h("div", {
                        className: "p-3 bg-yellow-50 rounded-xl border-2 min-h-[3.5rem] flex items-center justify-center " + (recording ? "border-red-300 ring-4 ring-red-50" : "border-purple-200")
                    },
                        h("p", { className: "text-base md:text-xl font-black text-slate-700 text-center" },
                            transcript || h("span", { className: "text-slate-300" }, "버튼을 누르고 말해보세요...")
                        )
                    )
                )
            ),
            // ── 피드백 팝업 ──
            feedback && !showConfetti && h(motion.div, {
                initial: { opacity: 0 },

                className: "fixed inset-0 flex items-center justify-center z-50",
                style: { background: 'rgba(0,0,0,0.45)' },

            },
                h(motion.div, {
                    initial: { scale: 0.75, y: 40 },

                    className: "mx-4 rounded-[2rem] shadow-2xl border-4 p-8 max-w-2xl w-full flex flex-col items-center gap-4 " + feedback.bg + " " + feedback.border,
                    style: { boxShadow: '0 20px 60px rgba(0,0,0,0.3)' },
                    onClick: function(e) { e.stopPropagation(); }
                },
                    h("span", { className: "text-8xl" }, feedback.emoji),
                    h("p", { className: "text-3xl font-black text-center " + feedback.textColor, style: { wordBreak: "keep-all", overflowWrap: "break-word" } }, feedback.text),
                    currentExample && h("div", { className: "px-5 py-2 bg-white rounded-full text-xl font-black " + feedback.textColor }, matchCount + "/5 맞았어요"),
                    detailedFeedback && h("div", {
                        className: "w-full px-4 py-3 bg-white/70 rounded-2xl text-center"
                    },
                        h("p", { className: "text-xl font-black " + feedback.textColor, style: { wordBreak: "keep-all", overflowWrap: "break-word" } }, "💡 " + detailedFeedback)

                    h("button", {
                        onClick: function() { setTranscript(''); setHasTriedRecording(false); setMustRetry(false); },

            h("div", { className: "flex flex-col items-center gap-3 shrink-0" },
                recording

                        h("div", { className: "flex gap-3 items-center" },
                            h("button", {
                                onClick: toggleRec,
                                className: "flex items-center gap-2 px-6 py-4 rounded-2xl font-black text-xl bg-slate-200 text-slate-600 border-2 border-slate-300"
                            }, "⏹️ 잠깐 멈추기"),
                            h("button", {
                                onClick: function() { if (recRef.current) recRef.current.stop(); },
                                className: "flex items-center gap-2 px-8 py-4 rounded-2xl font-black text-xl bg-emerald-500 text-white shadow-[0_5px_0_rgb(4,120,87)] active:translate-y-1 active:shadow-none"
                            }, "🎤 다 말했어요!")
                        )
                    )
                    : h(React.Fragment, null,
                        h("button", {
                            onClick: toggleRec,
                            className: "flex items-center gap-3 px-10 py-5 rounded-3xl font-black text-2xl shadow-lg bg-red-500 text-white"
                        }, transcript ? "🎤 다시 녹음하기" : "🎤 녹음 시작"),
                        (transcript || hasTriedRecording)
                            ? h("div", { className: "flex gap-3 items-center" },
                                h("button", {
                                    onClick: function () {
                                        if (!hasTriedRecording) return;
                                        if (recRef.current && recording) recRef.current.stop();
                                        if (exampleIdx + 1 < examples.length) {
                                            setExampleIdx(exampleIdx + 1); setTranscript(''); setHasTriedRecording(false); setSubStep('record');
                                        } else { setHasTriedRecording(false); setSubStep('choose'); }
                                    },
                                    className: "px-5 py-3 rounded-xl font-black text-lg bg-white text-slate-600 border-2 border-slate-300 hover:bg-slate-50"
                                }, "⏭️ 건너뛰기"),
                                h("button", {
                                    onClick: completeReading,
                                    disabled: mustRetry,
                                    className: "px-8 py-4 rounded-2xl text-xl font-black shadow-md border-4 " +
                                        (!mustRetry
                                            ? "bg-emerald-500 text-white border-emerald-600 shadow-[0_6px_0_rgb(4,120,87)] active:translate-y-1 active:shadow-none"
                                            : "bg-slate-200 text-slate-400 border-slate-300 cursor-not-allowed")
                                }, mustRetry ? "🎤 다시 녹음해주세요" : "✅ 완료!")
                            )
                            : null
                    )
            )
        );
    }

    // ───── choose (3개 예시 중 골라 공책에 쓰기) ─────
    else if (subStep === 'choose') {
        content = h("div", { className: "flex-1 flex flex-col p-3 gap-2 min-h-0 overflow-hidden" },
            h("div", { className: "flex items-start gap-3 shrink-0" },
                h(PencilFairy, { mini: true }),
                h("div", { className: "bg-white px-4 py-2 rounded-2xl shadow-md border-2 border-purple-200 mt-2" },
                    h("h2", { className: "text-2xl font-black text-slate-800" }, "마음에 드는 문장을 골라봐요!"),
                    h("p", { className: "text-2xl text-slate-500 font-bold mt-1" }, "고른 문장을 공책에 직접 써볼 거예요 ✏️")
                )
            ),
            h("div", { className: "flex-1 overflow-y-auto min-h-0 max-h-full" },
                h("div", { className: "grid grid-cols-1 gap-3 max-w-4xl mx-auto" },
                    examples.map(function (ex, i) {
                        return h(motion.button, {
                            key: i,
                            whileHover: { scale: 1.02, x: 5 },
                            whileTap: { scale: 0.98 },
                            onClick: function () { chooseSentence(i); },
                            className: "p-4 bg-white rounded-3xl shadow-md border-4 border-purple-100 hover:border-purple-400 hover:bg-purple-50 flex items-center gap-4"
                        },
                            h("span", { className: "shrink-0 w-10 h-10 rounded-full bg-purple-500 text-white flex items-center justify-center text-xl font-black" }, i + 1),
                            h("div", { className: "flex-1" },
                                h(ColoredSentence5, { parts: ex, size: 'sm' })
                            )
                        );
                    })
                )
            )
        );
    }

    // ───── write (공책) ─────
    else if (subStep === 'write') {
        var chosen = examples[chosenForWriting];
        var cells = buildCellGrid(chosen);
        var lineCount = Math.ceil(cells.length / 10);

        content = h("div", { className: "flex-1 flex flex-col p-3 gap-2 min-h-0 overflow-hidden" },
            h("div", { className: "flex items-start gap-3 shrink-0" },
                h(PencilFairy, { mini: true }),
                h("div", { className: "bg-white px-4 py-2 rounded-2xl shadow-md border-2 border-purple-200 mt-2" },
                    h("h2", { className: "text-2xl font-black text-slate-800" }, "공책에 한 글자씩 따라 써봐요!"),
                    h("p", { className: "text-2xl text-slate-500 font-bold mt-1" },
                        "화면을 보면서 ", h("span", { className: "text-purple-600 font-black" }, "내 공책에 직접"), " 써보세요"
                    )
                ),
                h("button", {
                    onClick: function () { setSubStep('choose'); },
                    className: "ml-auto self-center px-4 py-2 bg-slate-100 text-slate-500 rounded-2xl font-black text-base hover:bg-slate-200"
                }, "← 다른 문장")
            ),
            h("div", { className: "flex-1 flex items-center justify-center min-h-0 overflow-hidden" },
                h("div", { className: "bg-white p-6 rounded-[2rem] shadow-2xl border-4 border-purple-200" },
                    h(NotebookGrid, { cells: cells })
                )
            ),
            h("div", { className: "flex items-center justify-center gap-4" },
                h("div", { className: "px-5 py-2 bg-amber-50 border-2 border-amber-200 rounded-full text-amber-700 font-black" },
                    lineCount === 1 ? "📖 한 줄짜리 짧은 문장이에요" :
                    lineCount === 2 ? "📖 두 줄짜리 문장이에요" :
                    lineCount === 3 ? "📖 세 줄짜리 문장이에요" :
                    "📖 " + lineCount + "줄짜리 긴 문장이에요"
                ),
                h("button", {
                    onClick: finishWriting,
                    className: "px-10 py-3 bg-emerald-500 text-white rounded-2xl text-xl font-black shadow-[0_6px_0_rgb(4,120,87)] active:translate-y-1 active:shadow-none"
                }, "✅ 공책에 다 썼어요!")
            )
        );
    }

    // ───── complete ─────
    else if (subStep === 'complete') {
        content = h("div", { className: "flex-1 flex flex-col items-center justify-center p-4 gap-4 overflow-hidden" },
            h(motion.div, { initial: { scale: 0 }, animate: { scale: 1 }, className: "text-8xl" }, "💖"),
            h("h2", { className: "text-5xl font-black text-purple-600" }, "감정 학습 끝! 정말 멋져요!"),
            h("p", { className: "text-2xl font-bold text-slate-600" },
                "「", h("span", { className: "text-purple-500 font-black" }, drawn.value), "」 감정 카드를 모았어요!"
            ),
            h("div", { className: "flex items-center gap-3 px-6 py-3 bg-white rounded-3xl shadow-md border-4 " + GROUP_COLORS[drawn.group].border },
                h("span", { className: "text-4xl" }, drawn.emoji),
                h("div", { className: "flex flex-col" },
                    h("span", { className: "text-xs font-black " + GROUP_COLORS[drawn.group].text }, GROUP_LABELS[drawn.group]),
                    h("span", { className: "text-2xl font-black text-slate-700" }, drawn.value)
                )
            ),
            h("div", { className: "bg-purple-50 px-6 py-3 rounded-full border-2 border-purple-200" },
                h("span", { className: "text-2xl font-black text-purple-700" },
                    "💖 감정 카드: ",
                    h("span", { className: "text-3xl text-purple-600" }, finalCards.length || collected.length),
                    " 장"
                )
            ),
            h("button", {
                onClick: function() {
                    var cards = finalCards.length > 0 ? finalCards : collected;
                    if (props.onComplete) props.onComplete(cards);
                    else if (props.onBack) props.onBack();
                    else restart();
                },
                className: "px-16 py-5 bg-purple-500 text-white rounded-2xl text-3xl font-black shadow-[0_8px_0_rgb(107,33,168)] active:translate-y-1 active:shadow-none"
            }, "← 메뉴로 돌아가기")
        );
    }

    return h("div", { className: "w-full bg-[#F0F7FF] flex flex-col overflow-hidden min-h-0", style: { height: "100dvh" } },
        h(StageHeader, {
            currentKey: 's2_1',
            onChangeStage: props.onChangeStage,
            onGoHome: props.onBack,
            rightSlot: h("div", { className: "flex items-center gap-2 px-5 py-2 bg-white border-2 border-purple-300 rounded-2xl shadow-sm" },
                h("span", { className: "text-2xl" }, "💖"),
                h("span", { className: "text-xl font-black text-purple-600" }, collected.length + "장")
            )
        }),
        h("main", { className: "flex-1 overflow-hidden min-h-0 flex flex-col" }, content),
        h(Confetti, { show: showConfetti })
    );
}

};

// 감정들을 자연스럽게 연결 ("기쁘다, 신나다" → "기쁘고 신났다" 또는 "기쁘면서 신났다")
function joinFeelings(feelings) {
    if (!feelings || feelings.length === 0) return '';
    if (feelings.length === 1) return feelings[0].text;
    // "다"로 끝나는 단어를 자연스럽게 연결
    var parts = feelings.map(function (f, i) {
        if (i === feelings.length - 1) return f.text;
        // 중간 감정들은 "~고" 형태로
        var t = f.text;
        // "다"로 끝나면 "고"로 바꾸기
        if (/다$/.test(t)) {
            return t.replace(/다$/, '고');
        }
        return t;
    });
    return parts.join(' ');
}

// 일기 본문 자동 생성: 1단계-2 + 2단계-2 결과 합치기
function composeDiaryText(d) {
    var parts = d.baseParts;
    // 1단계-2 결과
    var s1 = parts.when + ' ' + parts.where + ' ' + parts.who + ' ' + parts.what + '.';
    // 2단계-2 결과 (감정 + 이유)
    var feelingText = joinFeelings(d.feelings);
    var s2 = '그래서 ' + feelingText + '.';
    var reasonClean = (d.reason || '').trim();
    if (!/[.!?。]$/.test(reasonClean)) reasonClean += '.';
    var s3 = '왜냐하면 ' + reasonClean;
    return s1 + ' ' + s2 + ' ' + s3;
}

function DrawBoard(props) {
    var canvasRef = useRef(null);
    var s = useState(false); var drawing = s[0], setDrawing = s[1];
    var s2 = useState('#1e40af'); var color = s2[0], setColor = s2[1];
    var s3 = useState(4); var thickness = s3[0], setThickness = s3[1];

    var COLORS = ['#1e40af', '#dc2626', '#16a34a', '#ca8a04', '#a855f7', '#000000'];

    function getPos(e, canvas) {
        var rect = canvas.getBoundingClientRect();
        var sx = canvas.width / rect.width;
        var sy = canvas.height / rect.height;
        var clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        var clientY = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
        return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
    }

    function start(e) {
        e.preventDefault();
        var canvas = canvasRef.current;
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var p = getPos(e, canvas);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = thickness;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        setDrawing(true);
    }
    function move(e) {
        if (!drawing) return;
        e.preventDefault();
        var canvas = canvasRef.current;
        var ctx = canvas.getContext('2d');
        var p = getPos(e, canvas);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    }
    function end() { setDrawing(false); }
    function clear() {
        var canvas = canvasRef.current;
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 흰 배경 다시 깔기
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 첫 렌더 시 흰 배경
    useEffect(function () {
        var canvas = canvasRef.current;
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }, []);

    // 외부에서 그림 데이터 가져갈 수 있게
    useEffect(function () {
        if (props.canvasRefOut) props.canvasRefOut(canvasRef.current);
    });

    return h("div", { className: "flex flex-col gap-2" },
        // 도구
        h("div", { className: "flex items-center gap-2 flex-wrap" },
            // 색
            h("div", { className: "flex gap-1" },

                    return h("button", {
                        key: c,
                        onClick: function () { setColor(c); },
                        style: { backgroundColor: c },
                        className: "w-8 h-8 rounded-full border-2 " + (color === c ? "border-slate-800 ring-2 ring-slate-300" : "border-white shadow")
                    });
                })
            ),
            // 굵기
            h("div", { className: "flex gap-1 ml-2" },
                [2, 4, 8].map(function (t) {
                    return h("button", {
                        key: t,
                        onClick: function () { setThickness(t); },
                        className: "w-8 h-8 rounded-full border-2 flex items-center justify-center " +
                            (thickness === t ? "border-slate-800 bg-slate-100" : "border-slate-200 bg-white")
                    },
                        h("div", {
                            style: { width: t * 2, height: t * 2, backgroundColor: '#1e293b' },
                            className: "rounded-full"
                        })
                    );
                })

            // 지우기

function MicPermissionScreen(props) {
    var studentName = props.studentName || '';
    var onDone = props.onDone || function(){};

    var st1 = useState('idle'); // 'idle' | 'granted' | 'denied'
    var micState = st1[0], setMicState = st1[1];

    function requestMic() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            // 브라우저 미지원
            setMicState('denied');
            return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function(stream) {
                // 허용 — 스트림 즉시 정지 (권한만 확인)
                stream.getTracks().forEach(function(t) { t.stop(); });
                setMicState('granted');
                // 1.5초 후 메뉴로 자동 이동
                setTimeout(onDone, 1500);
            })
            .catch(function() {
                setMicState('denied');
            });
    }

    return h("div", {
        className: "w-full flex flex-col items-center justify-center overflow-hidden",
        style: {
            height: '100dvh',
            background: 'linear-gradient(160deg, #FFF8E7 0%, #F0F4FF 40%, #FFF0F5 100%)'
        }
    },
        h(motion.div, {
            initial: { scale: 0.9, opacity: 0 },
            animate: { scale: 1, opacity: 1 },
            transition: { duration: 0.4 },
            className: "bg-white rounded-[2.5rem] shadow-2xl border-4 border-orange-200 p-8 mx-4 w-full max-w-lg flex flex-col items-center gap-6 text-center"
        },
            // 아이콘
            h(motion.div, {
                animate: micState === 'idle'
                    ? { scale: [1, 1.1, 1] }
                    : micState === 'granted'
                        ? { scale: [1, 1.3, 1], rotate: [0, 10, -10, 0] }
                        : {},
                transition: { repeat: micState === 'idle' ? Infinity : 0, duration: 2 },
                className: "text-8xl"
            },
                micState === 'granted' ? "🎉" :
                micState === 'denied'  ? "😢" : "🎤"
            ),

            // 제목
            h("div", { className: "flex flex-col gap-2" },
                h("h1", { className: "text-3xl font-black text-slate-800" },
                    micState === 'granted' ? "마이크 준비 완료!" :
                    micState === 'denied'  ? "마이크를 허용해주세요" :
                    studentName + " 학생, 반가워요! 👋"
                ),
                h("p", { className: "text-xl font-bold text-slate-500 leading-relaxed" },
                    micState === 'granted'
                        ? "이제 말하기 활동을 시작할 수 있어요! 잠깐 기다려요..."
                        : micState === 'denied'
                            ? "브라우저 주소창 옆 🔒 아이콘을 눌러서 마이크를 허용해주세요."
                            : "이 앱은 말하기 연습을 위해 마이크가 필요해요. 아래 버튼을 눌러 허용해주세요!"
                )
            ),

            // 버튼들
            micState === 'idle' && h("div", { className: "flex flex-col gap-3 w-full" },
                h(motion.button, {
                    whileHover: { scale: 1.03 },
                    whileTap: { scale: 0.97 },
                    onClick: requestMic,
                    className: "w-full py-5 rounded-2xl text-2xl font-black text-white bg-red-500 shadow-[0_6px_0_rgb(185,28,28)] active:translate-y-1 active:shadow-none"
                }, "🎤 마이크 허용하기"),
                h("button", {
                    onClick: onDone,
                    className: "w-full py-3 rounded-2xl text-lg font-bold text-slate-400 bg-slate-50 border-2 border-slate-200 hover:bg-slate-100"
                }, "마이크 없이 계속하기")
            ),

            micState === 'granted' && h(motion.div, {
                initial: { scale: 0 },
                animate: { scale: 1 },
                className: "w-full py-4 rounded-2xl text-2xl font-black text-white bg-emerald-500 text-center"
            }, "✅ 허용 완료! 메뉴로 이동 중..."),

            micState === 'denied' && h("div", { className: "flex flex-col gap-3 w-full" },
                h("div", {
                    className: "bg-red-50 rounded-2xl p-4 border-2 border-red-200 text-left"
                },
                    h("p", { className: "text-base font-bold text-red-700" },
                        "📋 허용 방법:", h("br", null),
                        "1. 브라우저 주소창 왼쪽 🔒 클릭", h("br", null),
                        "2. 마이크 → 허용 선택", h("br", null),
                        "3. 페이지 새로고침 후 다시 시도"
                    )
                ),
                h("button", {
                    onClick: requestMic,
                    className: "w-full py-4 rounded-2xl text-xl font-black text-white bg-orange-500 shadow-[0_5px_0_rgb(154,52,18)]"
                }, "🔄 다시 시도"),
                h("button", {
                    onClick: onDone,
                    className: "w-full py-3 rounded-2xl text-lg font-bold text-slate-400 bg-slate-50 border-2 border-slate-200"
                }, "마이크 없이 계속하기")
            )
        )
    );
}

function LoginScreen(props) {
    var onLogin = props.onLogin;

    var s1 = useState([]);          var students = s1[0], setStudents = s1[1];
    var s2 = useState('loading');   var status = s2[0], setStatus = s2[1];
    var s3 = useState('');          var selectedId = s3[0], setSelectedId = s3[1];
    var s4 = useState('');          var errorMsg = s4[0], setErrorMsg = s4[1];
    // status: 'loading' | 'ok' | 'error' | 'nogas'

    useEffect(function() {
        var isGasConfigured = GAS_URL.indexOf('여기에') === -1 &&
                              GAS_URL.indexOf('script.google.com') !== -1;
        if (!isGasConfigured) {
            setStudents([
                { id: 1, name: '김민서' },
                { id: 2, name: '이준혁' },
                { id: 3, name: '박소연' },
                { id: 4, name: '최지우' },
                { id: 5, name: '정하은' },
                { id: 6, name: '윤서준' },
            ]);
            setStatus('nogas');
            setErrorMsg('config.js 파일의 GAS_URL을 설정해주세요');
            return;
        }
        gasGet('getStudents')
            .then(function(d) {
                if (d && d.students && d.students.length > 0) {
                    setStudents(d.students);
                    setStatus('ok');
                } else if (d && d.error) {
                    setStatus('error');
                    setErrorMsg('GAS 오류: ' + d.error);
                } else {
                    setStatus('error');
                    setErrorMsg('명단이 비어있거나 응답 형식이 잘못됨: ' + JSON.stringify(d).substring(0, 100));
                }
            })
            .catch(function(err) {
                setStatus('error');
                setErrorMsg('GAS 통신 실패: ' + (err.message || err));
            });
    }, []);

    // 선택된 학생 객체
    var selectedStudent = null;
    for (var i = 0; i < students.length; i++) {
        if (String(students[i].id) === String(selectedId)) {
            selectedStudent = students[i];
            break;
        }
    }

    function handleConfirm() {
        if (selectedStudent) onLogin(selectedStudent);
    }

    return h("div", {
        className: "w-full flex flex-col items-center justify-center gap-4 p-4 md:p-6 overflow-hidden min-h-0",
        style: {
            height: '100dvh',
            background: 'linear-gradient(160deg, #FFF8E7 0%, #F0F4FF 40%, #FFF0F5 100%)'
        }
    },
        // 연필요정 + 제목
        h("div", { className: "flex flex-col items-center gap-2 shrink-0" },
            h(motion.div, {
                animate: { y: [0, -8, 0], rotate: [-2, 2, -2] },
                transition: { repeat: Infinity, duration: 3, ease: "easeInOut" }
            },
                h("svg", { width: "90", height: "110", viewBox: "0 0 120 150", fill: "none" },
                    h("path", { d: "M45 55C25 45 15 75 30 85C15 95 20 115 40 105", stroke: "#A0AEC0", strokeWidth: "4", strokeLinecap: "round" }),
                    h("path", { d: "M75 55C95 45 105 75 90 85C105 95 100 115 80 105", stroke: "#A0AEC0", strokeWidth: "4", strokeLinecap: "round" }),
                    h("path", { d: "M45 30L75 30V110L60 135L45 110V30Z", fill: "#F6AD55", stroke: "#4A5568", strokeWidth: "2" }),
                    h("path", { d: "M45 110L60 135L75 110H45Z", fill: "#FBD38D", stroke: "#4A5568", strokeWidth: "2" }),
                    h("path", { d: "M54 125L60 135L66 125H54Z", fill: "#2D3748" }),
                    h("path", { d: "M45 15C45 10 75 10 75 15V30H45V15Z", fill: "#FBB6CE", stroke: "#4A5568", strokeWidth: "2" }),
                    h("circle", { cx: "53", cy: "65", r: "2.5", fill: "#2D3748" }),
                    h("circle", { cx: "67", cy: "65", r: "2.5", fill: "#2D3748" }),
                    h("path", { d: "M56 78C56 78 60 82 64 78", stroke: "#2D3748", strokeWidth: "2", strokeLinecap: "round" })
                )
            ),
            h("h1", { className: "text-5xl font-black text-slate-800" }, "한 문장 일기장 ✏️"),
            h("p", { className: "text-xl font-bold text-slate-500" }, "내 이름을 골라봐요!")
        ),

        // 드롭다운 카드
        h("div", { className: "bg-white rounded-[2rem] shadow-2xl border-4 border-amber-200 p-5 w-full max-w-xl flex flex-col gap-4" },

            // 로딩
            status === 'loading' && h("div", { className: "flex flex-col items-center gap-3 py-6" },
                h(motion.div, {
                    animate: { rotate: 360 },
                    transition: { repeat: Infinity, duration: 1, ease: "linear" },
                    className: "text-5xl"
                }, "⏳"),
                h("p", { className: "text-xl font-black text-slate-500" }, "명단을 불러오는 중...")
            ),

            // 드롭다운
            (status === 'ok' || status === 'nogas') && h("div", { className: "flex flex-col gap-4" },
                status === 'nogas' && h("p", {
                    className: "text-xs font-bold text-amber-600 text-center bg-amber-50 py-2 rounded-xl"
                }, "⚠️ GAS 미연결 — 데모 명단입니다"),

                h("label", { className: "text-lg font-black text-slate-700" }, "🎒 내 이름"),
                h("select", {
                    value: selectedId,
                    onChange: function(e) { setSelectedId(e.target.value); },
                    className: "w-full text-xl font-black text-slate-800 px-4 py-3 rounded-2xl border-4 " +
                        (selectedId ? "border-amber-400 bg-amber-50" : "border-slate-300 bg-slate-50") +
                        " focus:outline-none focus:border-amber-500 cursor-pointer",
                    style: { appearance: 'auto' }
                },
                    h("option", { value: "" }, "▼ 이름을 골라주세요"),
                    students.map(function(st) {
                        return h("option", { key: st.id, value: String(st.id) },
                            st.id + "번 " + st.name
                        );
                    })
                ),

                // 선택된 학생 프리뷰
                selectedStudent
                    ? h(motion.div, {
                        initial: { scale: 0.9, opacity: 0 },
                        animate: { scale: 1, opacity: 1 },
                        className: "flex items-center gap-4 px-6 py-4 bg-amber-50 border-4 border-amber-300 rounded-2xl"
                    },
                        h("div", { className: "w-16 h-16 bg-gradient-to-br from-amber-200 to-orange-300 rounded-full flex items-center justify-center text-3xl border-4 border-white shadow-md" }, "🎒"),
                        h("div", null,
                            h("p", { className: "text-sm font-black text-amber-600" }, "안녕, 친구!"),
                            h("p", { className: "text-3xl font-black text-slate-800" }, selectedStudent.name)
                        )
                    )
                    : h("div", { className: "flex items-center justify-center gap-2 px-6 py-4 bg-slate-50 border-4 border-dashed border-slate-200 rounded-2xl" },
                        h("span", { className: "text-3xl" }, "👆"),
                        h("p", { className: "text-lg font-bold text-slate-400" }, "위에서 이름을 골라봐요!")
                    ),

                // 확인 버튼
                h("button", {
                    onClick: handleConfirm,
                    disabled: !selectedStudent,
                    className: "w-full py-4 rounded-2xl text-2xl font-black transition " +
                        (selectedStudent
                            ? "bg-amber-500 text-white shadow-[0_8px_0_rgb(154,52,18)] active:translate-y-1 active:shadow-none cursor-pointer"
                            : "bg-slate-200 text-slate-400 cursor-not-allowed")
                }, selectedStudent ? ("시작하기! 🎉") : "이름을 먼저 골라주세요")
            ),

            // 에러
            status === 'error' && h("div", { className: "flex flex-col items-center gap-4 py-6" },
                h("div", { className: "text-5xl" }, "😢"),
                h("p", { className: "text-xl font-black text-slate-600 text-center" },
                    "명단을 불러오지 못했어요.", h("br", null), "선생님께 말씀해주세요!"
                ),
                errorMsg && h("div", { className: "w-full px-4 py-3 bg-red-50 border-2 border-red-200 rounded-xl" },
                    h("p", { className: "text-xs font-bold text-red-700 break-all" }, errorMsg)
                ),
                h("p", { className: "text-xs text-slate-400 font-bold" }, "현재 GAS_URL: " + GAS_URL.substring(0, 60) + "...")
            )
        )
    );
}

// ═══════════════════════════════════════════════
// 최상위 App (라우터)
// ═══════════════════════════════════════════════
function App() {
    // screen: 'login' | 'menu' | 's1_1' | 's1_2' | 's2_1' | 's2_2' | 's3'
    var s1 = useState('login');
    var screen = s1[0], setScreen = s1[1];

    // 로그인된 학생
    var s2 = useState(null);
    var student = s2[0], setStudent = s2[1];

    // 진행 상태
    var s3 = useState(INIT_PROGRESS);
    var progress = s3[0], setProgress = s3[1];

    // 잠금 설정 버전 (LOCK_SETTINGS 변경 시 리렌더 트리거)
    var s4 = useState(0);
    var lockVer = s4[0], setLockVer = s4[1];

    function updateProgress(patch) {
        var next = Object.assign({}, progress, patch);
        setProgress(next);
        if (student) lsSet('diary_progress_' + student.id, next);
    }

    function doLogin(st) {
        setStudent(st);
        var saved = lsGet('diary_progress_' + st.id, null);
        var prog = saved
            ? Object.assign({}, INIT_PROGRESS, saved)
            : Object.assign({}, INIT_PROGRESS, { studentId: st.id, studentName: st.name });
        prog.studentName = st.name;
        prog.studentId = st.id;
        setProgress(prog);
        setScreen('mic_permission');  // 마이크 허용 화면 먼저

        var isGasOk = GAS_URL.indexOf('여기에') === -1 &&
                      GAS_URL.indexOf('script.google.com') !== -1;
        if (isGasOk) {
            // 잠금 설정 로드
            gasGet('getSettings')
                .then(function(d) {
                    if (d && d.settings) {
                        Object.assign(LOCK_SETTINGS, d.settings);
                        setLockVer(function(v) { return v + 1; });
                    }
                })
                .catch(function() {});

            // 카드 풀 로드 (언제/어디/누구/무엇 — DEMO_POOL 교체)
            gasGet('getCardPool')
                .then(function(d) {
                    if (d && d.cardPool && d.cardPool.length > 0) {
                        var newPool = { when: [], where: [], who: [], what: [] };
                        d.cardPool.forEach(function(card) {
                            var k = card.key;
                            if (newPool[k]) newPool[k].push({ value: card.value, emoji: card.emoji || '✨' });
                        });
                        ['when', 'where', 'who', 'what'].forEach(function(k) {
                            if (newPool[k].length > 0) DEMO_POOL[k] = newPool[k];
                        });
                    }
                })
                .catch(function() {});

            // 예시문장 테이블 로드 (4요소 — DEMO_EXAMPLES_TABLE 교체)
            gasGet('getExamplesTable')
                .then(function(d) {
                    if (d && d.examplesTable && Object.keys(d.examplesTable).length > 0) {
                        Object.keys(d.examplesTable).forEach(function(k) {
                            var rows = d.examplesTable[k];
                            if (!Array.isArray(rows)) return;
                            var normalized = rows.map(function(row) {
                                if (Array.isArray(row)) return row;
                                if (row && typeof row === 'object') {
                                    return [row.when || '', row.where || '', row.who || '', row.what || ''];
                                }
                                return null;
                            }).filter(function(r) {
                                return r && r.length >= 4 && r[0] && r[1] && r[2] && r[3];
                            });
                            if (normalized.length > 0) DEMO_EXAMPLES_TABLE[k] = normalized;
                        });
                    }
                })
                .catch(function() {});

            // 감정 풀 로드 (FEELINGS_POOL 교체)
            gasGet('getFeelingsPool')
                .then(function(d) {
                    if (d && d.feelingsPool && d.feelingsPool.length > 0) {
                        FEELINGS_POOL.length = 0;
                        d.feelingsPool.forEach(function(f) {
                            FEELINGS_POOL.push({
                                value: f.value,
                                emoji: f.emoji || '💜',
                                group: f.group || 'yellow',
                                desc:  f.desc  || ''
                            });
                        });
                    }
                })
                .catch(function() {});

            // 감정 예시문장 로드 (FEELINGS_EXAMPLES 교체)
            gasGet('getFeelingsTable')
                .then(function(d) {
                    if (d && d.feelingsTable && Object.keys(d.feelingsTable).length > 0) {
                        Object.keys(d.feelingsTable).forEach(function(k) {
                            var rows = d.feelingsTable[k];
                            if (!Array.isArray(rows) || rows.length === 0) return;
                            var normalized = rows.map(function(row) {
                                if (Array.isArray(row)) return row;
                                if (row && typeof row === 'object') {
                                    return [row.when || '', row.where || '', row.who || '', row.what || '', row.feeling || ''];
                                }
                                return null;
                            }).filter(function(r) {
                                return r && r.length >= 4 && r[0];
                            });
                            if (normalized.length > 0) FEELINGS_EXAMPLES[k] = normalized;
                        });
                    }
                })
                .catch(function() {});
        }
    }

    function goTo(sc) { setScreen(sc); }
    function goMenu() { setScreen('menu'); }
    function goLogin() {
        setStudent(null);
        setProgress(INIT_PROGRESS);
        setScreen('login');
    }

    var content = null;

    if (screen === 'login') {
        content = h(LoginScreen, { onLogin: doLogin });

    } else if (screen === 'mic_permission') {
        content = h(MicPermissionScreen, {
            studentName: student ? student.name : '',
            onDone: goMenu
        });

    } else if (screen === 'menu') {
        content = h(MainMenu, {
            progress: progress,
            lockVer: lockVer,
            onNavigate: function(stageNum, sub) {
                // 잠금 체크
                if (stageNum === '1' && sub === '2' && LOCK_SETTINGS.lock_stage1_2) return;
                if (stageNum === '2' && sub === '1' && LOCK_SETTINGS.lock_stage2_1) return;
                if (stageNum === '2' && sub === '2' && LOCK_SETTINGS.lock_stage2_2) return;
                if (stageNum === '3' && LOCK_SETTINGS.lock_stage3) return;

                // 화면 키 결정
                var screen;
                if      (stageNum === '1' && sub === '1') screen = 's1_1';
                else if (stageNum === '1' && sub === '2') screen = 's1_2';
                else if (stageNum === '2' && sub === '1') screen = 's2_1';
                else if (stageNum === '2' && sub === '2') screen = 's2_2';
                else if (stageNum === '3')                screen = 's3';
                if (screen) goTo(screen);
            },
            onChangeStudent: goLogin
        });

    } else if (screen === 's1_1') {
        content = h(Stage1_1, {
            onBack: goMenu,
            onChangeStage: function(key) { goTo(key); },
            collectedCards: progress.cards1List || [],
            onComplete: function(newCards) {
                // 카드 누적 병합 (key + value 같으면 중복 제거)
                var existing = progress.cards1List || [];
                var incoming = Array.isArray(newCards) ? newCards : [];

                // 새로 추가된 카드만 추출
                var addedCards = [];
                incoming.forEach(function(nc) {
                    var dup = false;
                    for (var i = 0; i < existing.length; i++) {
                        if (existing[i].key === nc.key && existing[i].value === nc.value) { dup = true; break; }
                    }
                    if (!dup) addedCards.push(nc);
                });

                // GAS에 새 카드만 전송
                if (addedCards.length > 0) {
                    try {
                        gasPost({
                            type: 'saveCard',
                            studentId: student ? student.id : '',
                            studentName: student ? student.name : '',
                            stage: '1단계❶',
                            cards: addedCards
                        }).catch(function(){});
                    } catch(e) {}
                }

                // 병합된 전체 목록 저장
                var merged = existing.concat(addedCards);
                updateProgress({
                    cards1: merged.length,
                    cards1List: merged
                });
                goMenu();
            }
        });

    } else if (screen === 's1_2') {
        content = h(Stage1_2, {
            onBack: goMenu,
            onChangeStage: function(key) { goTo(key); },
            onComplete: function(sentence) {
                // 문장 완성 기록 → 학습문장 시트
                try {
                    gasPost({
                        type: 'saveSentence',
                        studentId: student ? student.id : '',
                        studentName: student ? student.name : '',
                        stage: '1단계❷',
                        sentence1: sentence
                    }).catch(function(){});
                } catch(e) {}
                updateProgress({ did1_2: true, sentence1: sentence });
                goMenu();
            },
            cards1: progress.cards1,
            collectedCards: progress.cards1List || []
        });

    } else if (screen === 's2_1') {
        content = h(Stage2_1, {
            onBack: goMenu,
            onChangeStage: function(key) { goTo(key); },
            collectedCards: progress.cards2List || [],
            onComplete: function(newCards) {
                // 감정 카드 누적 병합 (value 같으면 중복)
                var existing = progress.cards2List || [];
                var incoming = Array.isArray(newCards) ? newCards : [];

                // 새로 추가된 카드만 추출 (시트에는 새 카드만 누가)
                var addedCards = [];
                incoming.forEach(function(nc) {
                    var dup = false;
                    for (var i = 0; i < existing.length; i++) {
                        if (existing[i].value === nc.value) { dup = true; break; }
                    }
                    if (!dup) addedCards.push(nc);
                });

                // GAS에 새 카드만 전송
                if (addedCards.length > 0) {
                    try {
                        gasPost({
                            type: 'saveCard',
                            studentId: student ? student.id : '',
                            studentName: student ? student.name : '',
                            stage: '2단계❶',
                            cards: addedCards
                        }).catch(function(){});
                    } catch(e) {}
                }

                // 병합된 전체 목록 저장
                var merged = existing.concat(addedCards);
                updateProgress({
                    cards2: merged.length,
                    cards2List: merged
                });
                goMenu();
            }
        });

    } else if (screen === 's2_2') {
        content = h(Stage2_2, {
            onBack: goMenu,
            onChangeStage: function(key) { goTo(key); },
            onComplete: function(result) {
                // 감정 문장 완성 기록 → 학습문장 시트
                try {
                    gasPost({
                        type: 'saveSentence',
                        studentId: student ? student.id : '',
                        studentName: student ? student.name : '',
                        stage: '2단계❷',
                        sentence2: result
                    }).catch(function(){});
                } catch(e) {}
                updateProgress({ did2_2: true, sentence2: result });
                goMenu();
            },
            cards2: progress.cards2
        });

    } else if (screen === 's3') {
        content = h(Stage3, {
            onBack: goMenu,
            onChangeStage: function(key) { goTo(key); },
            progress: progress,
            gasPost: gasPost
        });
    }

    return h('div', { className: 'w-full overflow-hidden bg-[#F0F7FF]', style: { height: '100dvh' } }, content);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
